<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="教室聯絡簿">
<title>教室聯絡簿</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Huninn&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<script>
/* =====================================================================
 * 【外掛擴充模組設定】
 * ===================================================================== */
const PLUGIN_URL = 'https://raw.githubusercontent.com/hs12195/class-board-plugins/main/lotto-plugins.js';
/* 外掛檔的 SHA-256。雜湊不符時會拒絕載入（防止 GitHub 檔案被竄改後在教室頁面執行）。
 * 你自己更新 lotto-plugins.js 後，請重新執行 patch 或把這裡換成新的雜湊值；留空字串＝不檢查。 */
const PLUGIN_SHA256 = 'b4fbc47659bc82cfa81d8e73448ea5aa81dbc710eacc3b58e65fab554531b744';
window.LOTTO_PLUGINS = [];
(async function () {
  if (!PLUGIN_URL) return;
  try {
    const res = await fetch(PLUGIN_URL, { cache: 'no-cache' });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const code = await res.text();
    if (PLUGIN_SHA256) {
      const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(code));
      const hex = Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, '0')).join('');
      if (hex !== PLUGIN_SHA256.toLowerCase()) throw new Error('外掛雜湊值不符，已拒絕載入');
    }
    (new Function(code))();
    console.log('✅ 外部遊戲載入成功，共', window.LOTTO_PLUGINS.length, '款');
  } catch (err) {
    window.LOTTO_PLUGINS.length = 0;
    console.log('無外部擴充模組，使用內建模式', err);
  }
})();
</script>
<style>
:root,#admin,.modal{
  --th:#FFF3D1; --odd:#FFF7E6; --notice:#FDEBE6; --hl:#FBE7B0; --inkrgb:62,58,57;
  --paper:#FFFCF6; --card:#FFFEFA; --ink:#3E3A39;
  --coral:#F2A497; --yellow:#F6D27A; --sky:#A8D3E6; --green:#B9DAA5;
  --red:#D9453D; --navy:#14456A; --tickgreen:#6DB04F;
  --bd:3px solid var(--ink); --r:20px; --shadow:4px 4px 0 var(--ink);
  --font:'Huninn','jf-openhuninn','Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--paper);color:var(--ink);font-family:var(--font)}
body{overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation}
h1,h2,h3,p{margin:0}
svg{display:block}

/* ---------- 動畫 ---------- */
@keyframes float{0%,100%{transform:translateY(0) rotate(var(--rot,0deg))}50%{transform:translateY(-7px) rotate(calc(var(--rot,0deg) + 5deg))}}
@keyframes pop{0%{transform:scale(.55)}55%{transform:scale(1.2)}100%{transform:scale(1)}}
@keyframes pulse{0%{opacity:1}50%{opacity:.35}100%{opacity:1}}
@keyframes twinkle{0%,100%{transform:scale(1) rotate(-6deg)}50%{transform:scale(1.18) rotate(8deg)}}
@keyframes spinDrum{0%{transform:rotate(0deg)}100%{transform:rotate(1080deg)}}
@keyframes ballDrop{0%{transform:translateY(-35px) scale(.4);opacity:0}65%{transform:translateY(4px) scale(1.15);opacity:1}100%{transform:translateY(0) scale(1);opacity:1}}
@keyframes ropePull{0%{transform:translateY(0)}45%{transform:translateY(22px)}100%{transform:translateY(8px)}}
@keyframes swayPosts{0%,100%{transform:translateX(-14px)}50%{transform:translateX(14px)}}
@keyframes shootBasket{0%{transform:translate(0,0) scale(1)}50%{transform:translate(0,-115px) scale(.82)}85%{transform:translate(0,-88px) scale(.75)}100%{transform:translate(0,-65px) scale(.75);opacity:0}}
@keyframes appleDrop{0%{transform:translateY(0) rotate(0deg)}75%{transform:translateY(105px) rotate(25deg)}100%{transform:translateY(96px) rotate(12deg)}}
@keyframes swimFish{0%,100%{transform:translate(0,0) scaleX(1)}50%{transform:translate(14px,-6px) scaleX(1)}}
.deco{position:absolute;pointer-events:none;animation:float 5s ease-in-out infinite}
.pop .badge,.pop .tick,.pop .xmark{animation:pop .34s cubic-bezier(.3,1.6,.5,1)}
.dot.busy{animation:pulse .8s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
}

/* ---------- 前台（教室大螢幕） ---------- */
#front{height:100vh;height:100dvh;display:grid;grid-template-rows:minmax(0,1fr) auto;gap:.8vh;padding:1.5vh 1.3vw .6vh}
.main{display:grid;grid-template-columns:55fr 45fr;gap:1.3vw;min-height:0}
.panel{position:relative;display:flex;flex-direction:column;min-height:0;overflow:hidden;background:var(--card);border:var(--bd);border-radius:var(--r);box-shadow:var(--shadow)}
.phead{position:relative;flex:none;display:flex;align-items:center;gap:.9vw;padding:.9vh 1.2vw;border-bottom:var(--bd);min-height:9vh}
.left .phead{background:var(--sky)}
.right .phead{background:var(--yellow);justify-content:space-between}
.hicon{width:6.4vh;height:6.4vh;flex:none}
.ttl h1{font-size:clamp(20px,3.5vh,44px);line-height:1.15}
.ttl p{font-size:clamp(11px,1.75vh,22px);margin-top:.4vh;line-height:1.3}
.phead .deco{right:1vw;top:50%;margin-top:-3.6vh;width:7.2vh;height:7.2vh;--rot:8deg}
.phead .pencil-secret{pointer-events:auto;cursor:pointer;border-radius:14px;transition:transform .12s}
.phead .pencil-secret:active{transform:scale(.88)}

/* 作業表格 */
.tblwrap{flex:1 1 0;min-height:0;display:flex;flex-direction:column}
.tbl{flex:1;min-height:0;display:grid;--b:clamp(38px,5.2vh,54px);
  grid-template-columns:minmax(150px,1.35fr) repeat(var(--cols),minmax(120px,1fr));
  grid-template-rows:auto repeat(var(--rows),minmax(68px,1fr));
  overflow:auto;-webkit-overflow-scrolling:touch;scrollbar-width:thin}
.th{position:sticky;top:0;z-index:3;display:flex;align-items:center;justify-content:center;text-align:center;padding:1vh .6vw;background:var(--th);border-bottom:var(--bd);border-left:2px solid rgba(var(--inkrgb),.35);font-size:clamp(16px,2.7vh,32px);line-height:1.25;font-weight:700;word-break:break-word}
.th.corner{left:0;z-index:4;justify-content:flex-start;padding:1vh .8vw;border-left:0;background:var(--green);font-size:clamp(15px,2.4vh,28px)}
.dense .th{font-size:clamp(14px,2.2vh,26px)}
.tmp{font-style:normal;margin-left:.3em;padding:0 .35em;border:2px solid var(--ink);border-radius:8px;background:var(--coral);font-size:.7em}
.nm{position:sticky;left:0;z-index:2;display:flex;align-items:center;gap:.5vw;padding:0 .8vw;border-bottom:2px solid rgba(var(--inkrgb),.22);font-size:clamp(16px,2.9vh,34px);white-space:nowrap;overflow:hidden;border-top:0;border-left:0;border-right:0;background:var(--card);text-align:left;width:100%}
.nm.odd{background:var(--odd)}
.nm .no{display:grid;place-items:center;flex:none;min-width:1.55em;height:1.55em;padding:0 .2em;border:2px solid var(--ink);border-radius:50%;background:var(--paper);font-size:.82em;line-height:1}
.nm .sname{overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0}
.nm-btn{cursor:pointer}
.nm-btn:hover{background:var(--th)}
.nm-btn:active{transform:scale(.97)}
.star-ic{width:1.15em;height:1.15em;flex:none;animation:twinkle 1.6s ease-in-out infinite;filter:drop-shadow(1px 1px 0 rgba(var(--inkrgb),.4))}
.star-done{flex:none;display:inline-flex;align-items:center;gap:.15em;padding:.08em .42em;border:2px solid var(--ink);border-radius:999px;background:var(--yellow);font-size:.58em;font-weight:700;line-height:1.2}
.cell{position:relative;display:flex;align-items:center;justify-content:center;min-width:0;min-height:0;padding:0;border:0;border-bottom:2px solid rgba(var(--inkrgb),.22);border-left:2px solid rgba(var(--inkrgb),.2);background:transparent}
.odd{background:var(--odd)}
.bw{position:relative;display:inline-flex;width:var(--b);height:var(--b)}
.badge{display:grid;place-items:center;width:100%;height:100%;border:3px solid var(--ink);border-radius:28%;font-size:calc(var(--b)*.6);line-height:1;font-weight:700;transition:transform .12s}
.badge.red{background:var(--red);color:#fff}
.badge.blue{background:var(--sky);color:var(--navy)}
.tick{width:calc(var(--b)*1.1);height:calc(var(--b)*1.1);transition:transform .12s}
.xmark{position:absolute;left:-14%;top:-14%;width:128%;height:128%;pointer-events:none}
.none{opacity:.22;font-size:calc(var(--b)*.55)}
.empty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1.2vh;text-align:center;padding:2vh;font-size:clamp(16px,3vh,36px)}
.empty svg{width:16vh;height:16vh;animation:float 5s ease-in-out infinite}
.empty small{font-size:.6em;opacity:.75}

.legend{flex:none;display:flex;flex-wrap:wrap;align-items:center;gap:.5vh 1.1vw;padding:.7vh 1vw;border-top:var(--bd);background:var(--odd);font-size:clamp(10px,1.6vh,19px)}
.legend .li{display:inline-flex;align-items:center;gap:.4em;--b:2.4vh}
.legend .li .badge{border-width:2px}
.carry{flex:none;display:flex;gap:.8vw;align-items:flex-start;max-height:17vh;padding:.8vh 1vw;border-top:var(--bd);background:var(--notice)}
.ctag{flex:none;padding:.5vh 1vw;border:var(--bd);border-radius:14px;background:var(--coral);font-size:clamp(12px,2vh,24px);font-weight:700;line-height:1.2;box-shadow:3px 3px 0 var(--ink)}
.cbody{flex:1;min-width:0;max-height:15vh;overflow:auto;display:flex;flex-wrap:wrap;gap:.6vh .8vw;align-content:flex-start;--b:3.4vh}
.cg{display:inline-flex;align-items:center;flex-wrap:wrap;gap:.35vw;padding:.4vh .7vw;border:2px solid var(--ink);border-radius:14px;background:var(--card);font-size:clamp(11px,1.9vh,22px)}
.cg .cd{font-weight:700}
.cg .badge{border-width:2px}
.cok{align-self:center;font-size:clamp(12px,2vh,24px)}

/* 右：聯絡簿 + 今日黑板便條 */
.rhead{display:flex;align-items:center;justify-content:space-between;width:100%;gap:.6vw}
.navbtn{flex:none;width:6.2vh;height:6.2vh;display:grid;place-items:center;border:var(--bd);border-radius:50%;background:var(--card);box-shadow:3px 3px 0 var(--ink);padding:0}
.navbtn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
.navbtn svg{width:55%;height:55%}
.dtbox{flex:1;text-align:center;min-width:0}
.dt{font-size:clamp(17px,3.1vh,40px);line-height:1.25;font-weight:700}
.dtsub{margin-top:.3vh;font-size:clamp(11px,1.7vh,20px);min-height:1.2em}
.chip{display:inline-block;padding:0 .7em;border:2px solid var(--ink);border-radius:999px;background:var(--coral);font-size:.9em}
.chipbtn{font:inherit;cursor:pointer;background:var(--sky)}
.notice-bar{flex:none;display:flex;align-items:center;gap:.6vw;padding:.8vh 1.1vw;border-bottom:var(--bd);background:var(--notice);font-size:clamp(14px,2.2vh,25px);font-weight:700;line-height:1.35}
.notice-bar .ntag{flex:none;padding:.1em .55em;border:2px solid var(--ink);border-radius:10px;background:var(--coral);font-size:.82em}
.rbody{position:relative;flex:1;min-height:0;display:flex;padding:1.2vh 1.4vw}
.vbox{flex:1;align-self:stretch;min-width:0;overflow:hidden;writing-mode:vertical-rl;text-orientation:mixed;font-size:var(--vfs,4vh);line-height:1.55}
.vbox ol{list-style:none;margin:0;padding:0;height:100%}
.vbox li{margin:0;padding-left:.45em;margin-left:.45em;border-left:2px dashed rgba(var(--inkrgb),.4)}
.vbox li:last-child{border-left:0}
.vbox .no{text-combine-upright:all;-webkit-text-combine:horizontal;font-weight:700;color:var(--coral);-webkit-text-stroke:0;margin-block-end:.15em;display:inline-block}
.vbox .tcy{text-combine-upright:all;-webkit-text-combine:horizontal;white-space:nowrap}
.vbox li.hw .t{background:var(--hl);border-radius:6px}
.rfoot{flex:none;position:relative;display:flex;align-items:center;gap:1vw;min-height:6vh;padding:.5vh 1.2vw;border-top:var(--bd);background:var(--odd);font-size:clamp(10px,1.6vh,19px)}
.rfoot .sw{display:inline-block;width:1.4em;height:1em;border:2px solid var(--ink);border-radius:5px;background:var(--hl);vertical-align:-.15em;margin-right:.4em}
.rfoot .sky-icons{margin-left:auto;display:flex;align-items:center;gap:.6vw}
.rfoot .sky-icons svg{width:5vh;height:5vh;animation:float 4.5s ease-in-out infinite}
.rfoot .sky-icons svg:nth-child(2){animation-delay:-1.6s}
.rfoot .sky-icons svg:nth-child(3){animation-delay:-3s}

/* 底部列 */
.fbar{display:flex;align-items:center;justify-content:space-between;gap:1vw;font-size:clamp(10px,1.6vh,18px);min-height:3.4vh}
.sync{display:inline-flex;align-items:center;gap:.5em;opacity:.75}
.dot{width:.8em;height:.8em;border-radius:50%;background:var(--tickgreen);border:2px solid var(--ink)}
.dot.off{background:var(--red)}
.fbar-acts{display:flex;align-items:center;gap:.6vw;flex-wrap:wrap}
.tbtn{opacity:.85;padding:.4vh 1vw;border:2px solid var(--ink);border-radius:999px;background:var(--card);font-size:inherit;box-shadow:2px 2px 0 var(--ink)}
.tbtn.rank{background:var(--yellow);font-weight:700}
.tbtn:hover,.tbtn:focus-visible{opacity:1}
.tbtn:active{transform:translate(1px,1px);box-shadow:1px 1px 0 var(--ink)}

/* 窄螢幕／直式（手機看前台） */
@media (max-aspect-ratio:1/1),(max-width:820px){
  body{overflow:auto}
  #front{height:auto;min-height:100dvh;display:block;padding:10px}
  .main{display:flex;flex-direction:column;gap:14px}
  .panel{overflow:visible}
  .phead{min-height:64px;padding:8px 12px;gap:10px}
  .hicon{width:44px;height:44px}
  .ttl h1{font-size:22px}.ttl p{font-size:12px}
  .phead .deco{width:50px;height:50px;margin-top:-25px}
  .tbl{--b:40px;grid-template-columns:minmax(125px,1.3fr) repeat(var(--cols),minmax(105px,1fr));grid-template-rows:auto repeat(var(--rows),64px);max-height:58vh;flex:none}
  .th{font-size:15px}.th.corner{font-size:14px}.nm{font-size:16px;padding:0 8px;gap:6px}
  .legend{font-size:12px;gap:6px 12px}.legend .li{--b:22px}
  .carry{max-height:none;flex-direction:column;padding:10px 12px}.cbody{max-height:none;--b:28px}
  .ctag{font-size:15px}.cg{font-size:13px}
  .navbtn{width:44px;height:44px}.dt{font-size:20px}.dtsub{font-size:12px}
  .notice-bar{font-size:14px;padding:8px 12px}
  .rbody{flex:none;height:62vh;padding:10px 12px}
  .rfoot{font-size:12px}.rfoot .sky-icons svg{width:34px;height:34px}
  .fbar{font-size:12px;padding:10px 4px;flex-wrap:wrap}.tbtn{padding:6px 12px}
}

/* ---------- 彈窗／提示 ---------- */
.overlay{position:fixed;inset:0;z-index:50;display:none;align-items:center;justify-content:center;padding:16px;background:rgba(30,28,27,.45)}
.overlay.show{display:flex}
.modal{width:min(490px,100%);max-height:90vh;overflow:auto;padding:22px;background:var(--card);border:var(--bd);border-radius:var(--r);box-shadow:var(--shadow)}
.modal h2{font-size:26px;margin-bottom:14px;display:flex;align-items:center;gap:10px}
.in{width:100%;min-height:52px;padding:10px 14px;border:var(--bd);border-radius:14px;background:#fff;font:inherit;font-size:19px;color:var(--ink)}
.in:focus{outline:3px solid var(--sky);outline-offset:1px}
.row2{display:flex;gap:10px;margin-top:14px}
.btn{min-height:56px;padding:10px 18px;border:var(--bd);border-radius:16px;background:var(--yellow);box-shadow:3px 3px 0 var(--ink);font-size:20px;line-height:1.2}
.btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
.btn.sky{background:var(--sky)}.btn.green{background:var(--green)}.btn.coral{background:var(--coral)}.btn.plain{background:var(--card)}
.btn.sm{min-height:44px;padding:6px 12px;font-size:17px;border-radius:14px}
.btn[disabled]{opacity:.5}
.grow{flex:1}
#toast{position:fixed;left:50%;bottom:4vh;z-index:80;transform:translateX(-50%);padding:10px 20px;border:var(--bd);border-radius:999px;background:var(--yellow);box-shadow:var(--shadow);font-size:18px;opacity:0;pointer-events:none;transition:opacity .2s;max-width:92vw;text-align:center}
#toast.show{opacity:1}

/* ---------- 星星抽獎（10種內建 + 無限外掛） ---------- */
.lotto-box{text-align:center}
.lotto-box h2{justify-content:center;font-size:27px}
.lotto-who{font-size:20px;margin-bottom:12px;padding:5px 16px;display:inline-block;background:var(--sky);border:2px solid var(--ink);border-radius:999px}
.lotto-msg{font-size:19px;line-height:1.5;min-height:2.8em;margin-top:10px}

.cards-row{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:10px auto 14px;max-width:390px}
.lcard{aspect-ratio:3/4;border:var(--bd);border-radius:18px;background:linear-gradient(145deg,#FFF4CC,#F6D27A);box-shadow:4px 4px 0 var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:8px;transition:transform .15s,background .2s}
.lcard:hover:not(:disabled){transform:translateY(-5px)}
.lcard svg{width:54px;height:54px}
.lcard span{font-size:18px;font-weight:700}
.lcard.picked{background:#FFFDF5;border-color:var(--red);transform:scale(1.06)}
.lcard.dim{opacity:.55;background:#F3EFE6}
.lcard .cpts{font-size:34px;font-weight:700;color:var(--red);animation:pop .4s cubic-bezier(.3,1.6,.5,1)}

.slot-wrap{display:flex;align-items:center;justify-content:center;gap:12px;margin:10px auto 14px}
.slot-frame{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:12px;background:var(--coral);border:var(--bd);border-radius:20px;box-shadow:var(--shadow)}
.slot-reel{width:76px;height:88px;background:var(--card);border:var(--bd);border-radius:14px;display:grid;place-items:center;font-size:34px;font-weight:700;color:var(--navy)}
.slot-reel svg{width:46px;height:46px}
.slot-lever{display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 12px;background:var(--yellow);border:var(--bd);border-radius:18px;box-shadow:3px 3px 0 var(--ink);font-weight:700}
.slot-ball{width:30px;height:30px;border-radius:50%;background:var(--red);border:var(--bd)}

.wheel-wrap{position:relative;display:flex;flex-direction:column;align-items:center;margin:6px auto 12px}
.wheel-drum{width:136px;height:136px;border-radius:50%;border:var(--bd);background:radial-gradient(circle at 35% 30%,#FFFFFF,#A8D3E6);box-shadow:var(--shadow);position:relative;display:grid;place-items:center}
.wheel-drum.spinning{animation:spinDrum 1.05s cubic-bezier(.25,.85,.35,1)}
.wheel-drum .mini-b{position:absolute;width:28px;height:28px;border-radius:50%;border:2.5px solid var(--ink);font-size:13px;font-weight:700;display:grid;place-items:center}
.wheel-drum .b1{top:16px;left:34px;background:var(--yellow)}
.wheel-drum .b2{top:34px;right:20px;background:var(--coral)}
.wheel-drum .b3{bottom:22px;left:24px;background:var(--green)}
.wheel-drum .b4{bottom:24px;right:34px;background:#FFF}
.wheel-chute{margin-top:-10px;z-index:2;min-height:66px;display:grid;place-items:center}
.gacha-ball{width:64px;height:64px;border-radius:50%;border:var(--bd);background:linear-gradient(135deg,#F6D27A 50%,#F2A497 50%);box-shadow:3px 3px 0 var(--ink);display:grid;place-items:center;font-size:26px;font-weight:700;color:var(--ink);animation:ballDrop .5s cubic-bezier(.3,1.5,.5,1)}

.ropes-box{position:relative;max-width:360px;margin:8px auto 14px;padding-top:10px}
.ropes-bar{height:22px;background:var(--coral);border:var(--bd);border-radius:999px;box-shadow:3px 3px 0 var(--ink);position:relative;z-index:2}
.ropes-row{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;padding:0 12px}
.rope-btn{display:flex;flex-direction:column;align-items:center;background:transparent;border:0;padding:0}
.rope-line{width:10px;height:68px;border-left:3px solid var(--ink);border-right:3px solid var(--ink);background:repeating-linear-gradient(45deg,#F6D27A,#F6D27A 8px,#FFF 8px,#FFF 16px)}

<script>
/* =====================================================================
 * 【Firebase Realtime Database 設定】
 * 請將下方引號內的網址，替換為你 Firebase 控制台的 Realtime Database 網址
 * （例如：https://class-board-12345-default-rtdb.asia-southeast1.firebasedatabase.app）
 * ===================================================================== */

const FIREBASE_DB_URL = 'https://class-board-8762b-default-rtdb.asia-southeast1.firebasedatabase.app';

const $ = (s, r) => (r || document).querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const WD = ['日','一','二','三','四','五','六'];
const LABEL = { unsubmitted:'未交', done:'已完成', correction:'待訂正', corrected:'訂正完成' };
const NEXT  = { '':'done', done:'unsubmitted', unsubmitted:'correction', correction:'corrected', corrected:'' };
const POLL_MS = 12000;
/* 台灣時區今日 YYYY-MM-DD */
function getTodayTaipei(){
  const now = new Date();
  const tw = new Date(now.getTime() + (8 * 60 + now.getTimezoneOffset()) * 60000);
  return tw.getFullYear() + '-' + String(tw.getMonth()+1).padStart(2,'0') + '-' + String(tw.getDate()).padStart(2,'0');
}
function parseYmd(s){ const p = s.split('-').map(Number); return new Date(Date.UTC(p[0], p[1]-1, p[2])); }
function fmtYmd(d){ return d.getUTCFullYear()+'-'+String(d.getUTCMonth()+1).padStart(2,'0')+'-'+String(d.getUTCDate()).padStart(2,'0'); }
function addDays(s,n){ const d = parseYmd(s); d.setUTCDate(d.getUTCDate()+n); return fmtYmd(d); }
function dow(s){ return parseYmd(s).getUTCDay(); }
function stepSchool(s,dir){ let d = addDays(s,dir); while(dow(d)===0 || dow(d)===6) d = addDays(d,dir); return d; }
function md(s){ const p = s.split('-'); return (+p[1])+'/'+(+p[2]); }
function nowTime(){ return new Date().toLocaleTimeString('zh-TW',{hour12:false}); }

/* Firebase 鍵值安全編碼（Firebase Key 不可包含 . # $ / [ ] |） */
function fbKey(str){
  return encodeURIComponent(String(str)).replace(/\./g, '%2E');
}
function fbUnkey(k){
  try { return decodeURIComponent(String(k)); } catch(e) { return String(k); }
}

const S = {
  db: null,
  board:null, viewDate:null, lastJson:'',
  adminOpen:false, tab:'week',
  week:null, draft:{}, dirty:{},
  sel:null, mode:'done', tempOpen:false, delArm:false, resetArm:false,
  lottoSeat:null, lottoBusy:false, lottoMode:0,
  ptSeats:new Set(), ptReason:'發表踴躍',
  pending:0, writeSeq:0, lastWrite:0, queue:Promise.resolve(), fetching:false, online:true,
  batchBuffer:{}, batchTimer:null
};

/* =====================================================================
 * Firebase Realtime Database 讀寫引擎（全記憶體結構化資料，0.1 秒極速回應）
 * ===================================================================== */
function dbBaseUrl(){
  if (!FIREBASE_DB_URL || FIREBASE_DB_URL.includes('請在這裡貼上')) {
    throw new Error('尚未設定 FIREBASE_DB_URL！請打開 index.html 貼上 Firebase 資料庫網址');
  }
  return FIREBASE_DB_URL.replace(/\/+$/, '');
}

async function fbGetAll(){
  const res = await fetch(dbBaseUrl() + '/boardData.json');
  if (!res.ok) throw new Error('Firebase 連線失敗 (HTTP ' + res.status + ')');
  const data = await res.json();
  return data || {};
}

async function fbPatch(path, obj){
  const res = await fetch(dbBaseUrl() + '/boardData/' + path + '.json', {
    method: 'PATCH',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(obj)
  });
  if (!res.ok) throw new Error('Firebase 寫入失敗 (HTTP ' + res.status + ')');
  return res.json();
}

async function fbPut(path, val){
  const res = await fetch(dbBaseUrl() + '/boardData/' + path + '.json', {
    method: 'PUT',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(val)
  });
  if (!res.ok) throw new Error('Firebase 儲存失敗 (HTTP ' + res.status + ')');
  return res.json();
}

async function fbGet(path){
  const res = await fetch(dbBaseUrl() + '/boardData/' + path + '.json');
  if (!res.ok) throw new Error('Firebase 連線失敗 (HTTP ' + res.status + ')');
  return res.json();
}

/* 只抓前台需要的節點（不再每 12 秒下載整個資料庫） */
async function fbGetBoardData(date){
  const d = date || getTodayTaipei();
  const r = await Promise.all([
    fbGet('students'), fbGet('notice'), fbGet('scores'), fbGet('pointLogs'), fbGet('carry'), fbGet('pets'),
    fbGet('sourceOverrides/' + d), fbGet('homework/' + d), fbGet('tempItems/' + d),
    fbGet('status/' + d), fbGet('lottery/' + d), fbGet('lotteryQuota/' + d)
  ]);
  const srcOv = r[6], hwDate = r[7];
  const src = srcOv || stepSchool(d, -1);
  const hwSrc = (src === d) ? hwDate : await fbGet('homework/' + src);
  const raw = {
    students: r[0], notice: r[1], scores: r[2], pointLogs: r[3], carry: r[4], pets: r[5],
    sourceOverrides: {}, homework: {}, tempItems: {}, status: {}, lottery: {}, lotteryQuota: {}
  };
  if (srcOv) raw.sourceOverrides[d] = srcOv;
  raw.homework[d] = hwDate; raw.homework[src] = hwSrc;
  raw.tempItems[d] = r[8]; raw.status[d] = r[9]; raw.lottery[d] = r[10]; raw.lotteryQuota[d] = r[11];
  return raw;
}

/* 以 ETag 做「讀取→修改→條件寫入」，多裝置同時操作時不會互相覆蓋。
 * updater 回傳 undefined 代表放棄寫入。若瀏覽器讀不到 ETag，會退回一般寫入。 */
async function fbTxn(path, updater, tries){
  tries = tries || 6;
  const url = dbBaseUrl() + '/boardData/' + path + '.json';
  for (let i = 0; i < tries; i++) {
    let res;
    try { res = await fetch(url, { headers: { 'X-Firebase-ETag': 'true' } }); }
    catch(e) { res = await fetch(url); }
    if (!res.ok) throw new Error('Firebase 連線失敗 (HTTP ' + res.status + ')');
    const etag = res.headers.get('ETag');
    const cur = await res.json();
    const next = updater(cur);
    if (next === undefined) return { committed: false, value: cur };
    const headers = { 'Content-Type': 'application/json' };
    if (etag) headers['if-match'] = etag;
    const w = await fetch(url, { method: 'PUT', headers: headers, body: JSON.stringify(next) });
    if (w.status === 412) { await new Promise(r => setTimeout(r, 60 + Math.random() * 140)); continue; }
    if (!w.ok) throw new Error('Firebase 寫入失敗 (HTTP ' + w.status + ')');
    return { committed: true, value: next };
  }
  throw new Error('目前同時操作的人較多，請稍後再試一次');
}
const SV_INC = n => ({ '.sv': { increment: n } });

/* 預設範例學生名單（初次使用若資料庫為空時自動顯示，老師可在後台「班級名單」隨時修改） */
function getStudentsList(rawDb){
  const arr = rawDb && rawDb.students;
  if (Array.isArray(arr) && arr.length) {
    return arr.filter(Boolean).map(x => ({ seat: Number(x.seat), name: String(x.name || '') }))
      .filter(x => x.seat > 0 && x.name).sort((a,b) => a.seat - b.seat);
  }
  if (arr && typeof arr === 'object') {
    return Object.values(arr).filter(Boolean).map(x => ({ seat: Number(x.seat), name: String(x.name || '') }))
      .filter(x => x.seat > 0 && x.name).sort((a,b) => a.seat - b.seat);
  }
  return [
    { seat: 1, name: '範例學生一' },
    { seat: 2, name: '範例學生二' },
    { seat: 3, name: '範例學生三' }
  ];
}

function buildBoardFromDb(rawDb, targetDate){
  const today = getTodayTaipei();
  const date = targetDate || today;
  const d = dow(date);
  const weekday = (d !== 0 && d !== 6);
  const students = getStudentsList(rawDb);

  const homeworkMap = (rawDb && rawDb.homework) || {};
  const sourceOverrides = (rawDb && rawDb.sourceOverrides) || {};
  const tempItemsMap = (rawDb && rawDb.tempItems) || {};
  const statusMap = (rawDb && rawDb.status) || {};
  const carryMap = (rawDb && rawDb.carry) || {};
  const lotteryMap = (rawDb && rawDb.lottery) || {};
  const lotteryQuotaMap = (rawDb && rawDb.lotteryQuota) || {};
  const scoresMap = (rawDb && rawDb.scores) || {};
  const pointLogsArr = Array.isArray(rawDb && rawDb.pointLogs) ? rawDb.pointLogs : [];

  /* 聯絡簿項目 */
  const dayLinesRaw = Array.isArray(homeworkMap[date]) ? homeworkMap[date] : [];
  const lines = dayLinesRaw.map(l => ({
    t: String(l.t || ''),
    hw: !!l.hw,
    name: String(l.name || l.t || '')
  }));

  /* 作業來源日 */
  const srcAuto = stepSchool(date, -1);
  const srcOverride = sourceOverrides[date] || '';
  const source = srcOverride || srcAuto;

  const items = [];
  if (weekday) {
    const srcLines = Array.isArray(homeworkMap[source]) ? homeworkMap[source] : [];
    srcLines.forEach(l => {
      if (l && l.hw) {
        items.push({ source: source, name: String(l.name || l.t || ''), temp: false });
      }
    });
    const temps = tempItemsMap[date] || {};
    Object.keys(temps).forEach(k => {
      if (temps[k]) items.push({ source: date, name: fbUnkey(k), temp: true });
    });
  }

  /* 當日作業狀態 */
  const status = {};
  const dayStatus = statusMap[date] || {};
  Object.keys(dayStatus).forEach(k => {
    const v = dayStatus[k];
    if (v) status[fbUnkey(k)] = v;
  });

  /* 跨日未結案欠交追蹤 */
  const carryGroups = {};
  Object.keys(carryMap).forEach(k => {
    const rec = carryMap[k];
    if (!rec || !rec.status) return;
    if (rec.due >= date) return; // 只顯示早於檢視日的未結案
    const gk = rec.due + '|' + rec.source + '|' + rec.name;
    if (!carryGroups[gk]) {
      carryGroups[gk] = { due: rec.due, source: rec.source, name: rec.name, entries: [] };
    }
    carryGroups[gk].entries.push({ seat: Number(rec.seat), status: rec.status });
  });
  const carry = Object.values(carryGroups).sort((a,b) => a.due.localeCompare(b.due));
  carry.forEach(g => g.entries.sort((a,b) => a.seat - b.seat));

  /* 今日抽獎與總積分 */
  const todayLotto = lotteryMap[date] || {};
  const lotteryToday = {};
  const lotteryUsedCount = {};
  Object.keys(todayLotto).forEach(seat => {
    const rec = todayLotto[seat];
    if (rec) {
      lotteryToday[seat] = Number(rec.points || 0);
      lotteryUsedCount[seat] = Number(rec.count || 0);
    }
  });

  const todayQuota = lotteryQuotaMap[date] || {};
  const lotteryExtraQuota = {};
  Object.keys(todayQuota).forEach(seat => {
    lotteryExtraQuota[seat] = Number(todayQuota[seat] || 0);
  });

  const scoreTotal = {};
  students.forEach(s => {
    scoreTotal[s.seat] = Number(scoresMap[s.seat] || 0);
  });

  return {
    today, date, weekday, source, srcAuto, srcOverride,
    notice: String((rawDb && rawDb.notice) || ''),
    students, lines, items, status, carry,
    lotteryToday, lotteryUsedCount, lotteryExtraQuota,
    scoreTotal,
    pets: (rawDb && rawDb.pets) || {},
    pointLogs: pointLogsArr.slice(0, 20)
  };
}

/* 統一後端呼叫轉接層（所有操作直接讀寫 Firebase Realtime Database） */
async function gs(fn){
  const args = Array.prototype.slice.call(arguments, 1);

  if (fn === 'getBoard') {
    const viewDate = args[0] || null;
    const rawDb = await fbGetBoardData(viewDate);
    return buildBoardFromDb(rawDb, viewDate);
  }

  if (fn === 'getWeek') {
    const anchor = args[0] || getTodayTaipei();
    const d = dow(anchor);
    const diffToMon = (d === 0) ? -6 : (1 - d);
    const monday = addDays(anchor, diffToMon);
    const dates = [0, 1, 2, 3, 4].map(i => addDays(monday, i));
    const lists = await Promise.all(dates.map(dt => fbGet('homework/' + dt)));
    const days = dates.map((dt, i) => {
      const rawLines = Array.isArray(lists[i]) ? lists[i] : [];
      return { date: dt, lines: rawLines.filter(Boolean).map(l => ({ t: l.t || '', hw: !!l.hw, name: l.name || l.t || '' })) };
    });
    return { today: getTodayTaipei(), monday, days };
  }

  if (fn === 'saveHomework') {
    const date = args[0], rows = args[1] || [];
    const formatted = rows.map(r => ({
      t: r.text,
      hw: !!r.check,
      name: r.check ? (r.short || r.text) : ''
    }));
    await fbPut('homework/' + date, formatted);
    if (!S.db) S.db = {};
    if (!S.db.homework) S.db.homework = {};
    S.db.homework[date] = formatted;
    return { ok: true };
  }

  if (fn === 'saveNotice') {
    const val = args[0] || '';
    await fbPut('notice', val);
    if (!S.db) S.db = {};
    S.db.notice = val;
    return { ok: true };
  }

  if (fn === 'setSource') {
    const date = args[0], src = args[1] || '';
    await fbPut('sourceOverrides/' + date, src || null);
    if (!S.db) S.db = {};
    if (!S.db.sourceOverrides) S.db.sourceOverrides = {};
    if (src) S.db.sourceOverrides[date] = src; else delete S.db.sourceOverrides[date];
    return { ok: true };
  }

  if (fn === 'addTempItem') {
    const date = args[0], name = args[1];
    await fbPut('tempItems/' + date + '/' + fbKey(name), true);
    return { ok: true };
  }

  if (fn === 'removeTempItem') {
    const date = args[0], name = args[1];
    await fbPut('tempItems/' + date + '/' + fbKey(name), null);
    return { ok: true };
  }

  if (fn === 'setStatusBatch') {
    const list = args[0] || [];
    const statusPatches = {};
    const carryPatches = {};
    list.forEach(p => {
      const k = fbKey(p.source + '|' + p.name + '|' + p.seat);
      statusPatches[p.due + '/' + k] = p.status || null;

      const ck = fbKey(p.due + '|' + p.source + '|' + p.name + '|' + p.seat);
      if (p.status === 'unsubmitted' || p.status === 'correction') {
        carryPatches[ck] = { due: p.due, source: p.source, name: p.name, seat: Number(p.seat), status: p.status };
      } else {
        carryPatches[ck] = null;
      }
    });
    await Promise.all([
      fbPatch('status', statusPatches),
      fbPatch('carry', carryPatches)
    ]);
    return { ok: true };
  }

  if (fn === 'drawLottery') {
    const date = args[0], seat = Number(args[1]);
    if (date !== getTodayTaipei()) throw new Error('只能抽取今天的獎勵');
    const raw = await fbGetBoardData(date);
    const allowed = drawAllowance(buildBoardFromDb(raw, date), seat);
    const pts = Math.floor(Math.random() * 3) + 1; // +1 ~ +3 分
    const tx = await fbTxn('lottery/' + date + '/' + seat, rec => {
      const used = Number((rec && rec.count) || 0);
      if (used >= allowed) return undefined;               // 名額已用完，不寫入
      return { points: Number((rec && rec.points) || 0) + pts, count: used + 1 };
    });
    if (!tx.committed) throw new Error('今天的抽獎機會已經用完囉！');
    await fbPut('scores/' + seat, SV_INC(pts));            // 伺服器端原子加分
    const total = Number(await fbGet('scores/' + seat)) || 0;
    return { ok: true, points: pts, todayTotal: tx.value.points, usedCount: tx.value.count, total: total };
  }

  if (fn === 'grantExtraLottery') {
    const seat = Number(args[0]);
    await fbPut('lotteryQuota/' + getTodayTaipei() + '/' + seat, SV_INC(1));
    const stu = getStudentsList({ students: await fbGet('students') }).find(s => s.seat === seat);
    return { ok: true, name: stu ? stu.name : '' };
  }

  if (fn === 'grantAllExtraLottery') {
    const stus = getStudentsList({ students: await fbGet('students') });
    const patches = {};
    stus.forEach(s => { patches[s.seat] = SV_INC(1); });
    await fbPatch('lotteryQuota/' + getTodayTaipei(), patches);
    return { ok: true, count: stus.length };
  }

  if (fn === 'addPoints') {
    const seats = args[0] || [], delta = Number(args[1] || 0), reason = String(args[2] || '');
    const stus = getStudentsList({ students: await fbGet('students') });
    const scorePatches = {};
    const newLogs = [];
    seats.forEach(seat => {
      scorePatches[seat] = SV_INC(delta);
      const stu = stus.find(s => s.seat === seat);
      newLogs.push({ seat: Number(seat), name: stu ? stu.name : '', delta, reason, ts: Date.now() });
    });
    await fbPatch('scores', scorePatches);
    await fbTxn('pointLogs', old => newLogs.concat(Array.isArray(old) ? old.filter(Boolean) : []).slice(0, 30));
    return { ok: true };
  }

  if (fn === 'resetAllScores') {
    await Promise.all([
      fbPut('scores', null),
      fbPut('lottery', null),
      fbPut('lotteryQuota', null),
      fbPut('pointLogs', null)
    ]);
    return { ok: true };
  }

  if (fn === 'petAction') {
    const actorSeat = Number(args[0]);
    const ownerSeat = Number(args[1]);
    const slotIdx = Number(args[2]); // 0 或 1
    const action = String(args[3]);  // 'adopt' | 'unlock2' | 'care_sun' | 'care_story' | 'care_warm' | 'feed' | 'pet' | 'play'
    const stus = getStudentsList({ students: await fbGet('students') });
    const actor = stus.find(s => s.seat === actorSeat);
    const owner = stus.find(s => s.seat === ownerSeat);
    if (!actor || !owner) throw new Error('找不到學生資料');

    const curScore = Number(await fbGet('scores/' + actorSeat)) || 0;
    const allPets = (await fbGet('pets')) || {};
    const actorRec = allPets[actorSeat] || {};
    const actorSlots = Array.isArray(actorRec.slots) ? actorRec.slots : (actorRec.slots ? Object.values(actorRec.slots) : []);
    const actorHasHatched = actorSlots.some(p => p && p.stage === 'pet');

    // 配件與高級點心商店目錄
    const SHOP_ITEMS = {
      acc_crown:  { id:'acc_crown',  type:'acc',   icon:'👑', name:'閃亮小皇冠',   cost:8,  desc:'戴在頭上超威風！寵物街也看得到' },
      acc_bow:    { id:'acc_bow',    type:'acc',   icon:'🎀', name:'粉紅蝴蝶結',   cost:5,  desc:'可愛度破表的經典造型蝴蝶結' },
      acc_scarf:  { id:'acc_scarf',  type:'acc',   icon:'🧣', name:'暖呼呼圍巾',   cost:6,  desc:'冬天保暖必備，氣質大加分' },
      acc_glasses:{ id:'acc_glasses',type:'acc',   icon:'🕶️', name:'酷炫太陽眼鏡', cost:7,  desc:'戴上秒變全班最潮的明星寵物' },
      acc_wing:   { id:'acc_wing',   type:'acc',   icon:'🪽', name:'天使小翅膀',   cost:10, desc:'夢幻系稀有配件，閃閃發光' },
      snack_cake: { id:'snack_cake', type:'snack', icon:'🍰', name:'草莓鮮奶油蛋糕', cost:3, desc:'高級點心！照顧次數直接 +3' },
      snack_star: { id:'snack_star', type:'snack', icon:'🍭', name:'彩虹棒棒糖',   cost:2,  desc:'甜蜜點心！照顧次數 +2 並提升好感' }
    };

    if (SHOP_ITEMS[action]) {
      const item = SHOP_ITEMS[action];
      if (actorSeat !== ownerSeat) throw new Error('只能在自己的配件點心屋購買喔！');
      const targetPet = actorSlots[slotIdx];
      if (!targetPet || targetPet.stage !== 'pet') {
        throw new Error('要等小寵物破殼出生之後，才能幫牠買配件或點心喔！');
      }
      if (item.type === 'acc') {
        const owned = Array.isArray(targetPet.accessories) ? targetPet.accessories : [];
        if (owned.includes(item.icon)) throw new Error('這隻小寵物已經擁有「' + item.name + '」囉！');
      }
      if (curScore < item.cost) {
        throw new Error('星星積分不足 ' + item.cost + ' 分，快去集點吧！');
      }

      const txShop = await fbTxn('pets/' + ownerSeat, cur => {
        const rec = cur || { slots: [] };
        const slots = Array.isArray(rec.slots) ? rec.slots.slice() : (rec.slots ? Object.values(rec.slots) : []);
        const p = slots[slotIdx];
        if (!p || p.stage !== 'pet') return undefined;
        if (item.type === 'acc') {
          const owned = Array.isArray(p.accessories) ? p.accessories.slice() : [];
          if (owned.includes(item.icon)) return undefined;
          owned.push(item.icon);
          p.accessories = owned;
          p.equippedAcc = item.icon;
          p.lastSpeech = '哇～謝謝主人送我「' + item.name + ' ' + item.icon + '」！戴起來是不是超好看？';
        } else {
          const addCare = item.id === 'snack_cake' ? 3 : 2;
          p.careCount = Number(p.careCount || 1) + addCare;
          p.lastSpeech = '嗚哇！是高級的「' + item.name + ' ' + item.icon + '」！幸福爆表，成長大躍進！';
        }
        slots[slotIdx] = p;
        return { slots };
      });
      if (!txShop.committed) throw new Error('購買未完成，請再試一次');

      await fbPut('scores/' + actorSeat, SV_INC(-item.cost));
      await fbTxn('pointLogs', old => [{
        seat: actorSeat, name: actor.name, delta: -item.cost,
        reason: '🎒 購買寵物' + (item.type === 'acc' ? '配件：' : '點心：') + item.name,
        ts: Date.now()
      }].concat(Array.isArray(old) ? old.filter(Boolean) : []).slice(0, 30));

      const newScore = Number(await fbGet('scores/' + actorSeat)) || 0;
      return { ok: true, newScore, slots: txShop.value.slots, shopPurchased: item };
    }

    if (action === 'equip_acc') {
      const iconToEquip = String(args[4] || '');
      const txEq = await fbTxn('pets/' + ownerSeat, cur => {
        const rec = cur || { slots: [] };
        const slots = Array.isArray(rec.slots) ? rec.slots.slice() : (rec.slots ? Object.values(rec.slots) : []);
        const p = slots[slotIdx];
        if (!p || p.stage !== 'pet') return undefined;
        p.equippedAcc = (p.equippedAcc === iconToEquip) ? '' : iconToEquip;
        slots[slotIdx] = p;
        return { slots };
      });
      return { ok: true, newScore: curScore, slots: txEq.value ? txEq.value.slots : actorSlots };
    }

    // 規則檢查
    let cost = 0;
    if (action === 'adopt') {
      if (actorSeat !== ownerSeat) throw new Error('只能幫自己領養神祕蛋喔！');
      if (actorSlots[0]) throw new Error('你已經領養過第一顆神祕蛋囉！');
      if (curScore < 10) throw new Error('需要累積滿 10 顆星星（10 分）才能領取神祕蛋喔！');
      cost = 10;
    } else if (action === 'unlock2') {
      if (actorSeat !== ownerSeat) throw new Error('只能開啟自己的第二隻寵物空間！');
      if (!actorSlots[0] || actorSlots[0].stage !== 'pet') throw new Error('要先等第一隻小寵物破殼出生，才能購買第二隻空間喔！');
      if (actorSlots[1]) throw new Error('你已經擁有第二隻小寵物啦！');
      if (curScore < 25) throw new Error('開啟第二隻寵物空間需要 25 顆星星（25 分）喔！');
      cost = 25;
    } else {
      // 照顧蛋或寵物：每次花費 1 分
      if (actorSeat !== ownerSeat && !actorHasHatched) {
        throw new Error('要等自己的小寵物破殼出生之後，才能去同學家串門子喔！');
      }
      cost = 1;
      if (curScore < cost) throw new Error('星星積分不足 1 分，快去完成作業抽獎集點吧！');
    }

    // 盲盒生物池（10 種可愛生物）
    const SPECIES_POOL = [
      { id:'shiba',   name:'暖陽柴犬',   icon:'🐶', rarity:'常見', w:15 },
      { id:'cat',     name:'橘貓團子',   icon:'🐱', rarity:'常見', w:15 },
      { id:'rabbit',  name:'垂耳兔寶',   icon:'🐰', rarity:'常見', w:14 },
      { id:'penguin', name:'圍巾企鵝',   icon:'🐧', rarity:'常見', w:14 },
      { id:'hamster', name:'倉鼠球球',   icon:'🐹', rarity:'常見', w:12 },
      { id:'fox',     name:'九尾小狐',   icon:'🦊', rarity:'稀有', w:10 },
      { id:'owl',     name:'星星貓頭鷹', icon:'🦉', rarity:'稀有', w:8 },
      { id:'turtle',  name:'寶石小海龜', icon:'🐢', rarity:'稀有', w:6 },
      { id:'dragon',  name:'水晶小飛龍', icon:'🐉', rarity:'傳說', w:3 },
      { id:'unicorn', name:'彩虹獨角獸', icon:'🦄', rarity:'傳說', w:3 }
    ];
    function rollSpecies(excludeId){
      const pool = SPECIES_POOL.filter(x => x.id !== excludeId);
      const sum = pool.reduce((a,b) => a + b.w, 0);
      let r = Math.random() * sum;
      for (const sp of pool) {
        r -= sp.w;
        if (r <= 0) return sp;
      }
      return pool[0];
    }

    let eventCard = null;
    let speech = '';
    let hatchedNow = null;

    const tx = await fbTxn('pets/' + ownerSeat, cur => {
      const rec = cur || { slots: [] };
      const slots = Array.isArray(rec.slots) ? rec.slots.slice() : (rec.slots ? Object.values(rec.slots) : []);
      const eggIcons = ['🥚', '🪺', '🔮', '🌟'];

      if (action === 'adopt') {
        if (slots[0]) return undefined;
        slots[0] = {
          stage: 'egg',
          eggIcon: eggIcons[Math.floor(Math.random() * eggIcons.length)],
          growth: 0,
          maxGrowth: 5,
          careCount: 0,
          lastAction: '',
          streak: 0,
          memories: {},
          lastSpeech: '一顆暖呼呼的神祕蛋誕生了！用星星照顧牠就會破殼喔～'
        };
        speech = slots[0].lastSpeech;
        return { slots };
      }

      if (action === 'unlock2') {
        if (slots[1]) return undefined;
        slots[1] = {
          stage: 'egg',
          eggIcon: '✨🥚',
          growth: 0,
          maxGrowth: 5,
          careCount: 0,
          lastAction: '',
          streak: 0,
          memories: {},
          lastSpeech: '第二顆閃亮神祕蛋登場！裡面會是哪一隻新夥伴呢？'
        };
        speech = slots[1].lastSpeech;
        return { slots };
      }

      const pet = slots[slotIdx];
      if (!pet) return undefined;
      if (actorSeat !== ownerSeat && pet.stage !== 'pet') {
        throw new Error('同學的蛋還在孵化中，等牠出生後再來串門子吧！');
      }

      pet.memories = pet.memories || {};
      const m = pet.memories[actorSeat] || { name: actor.name, feed: 0, pet: 0, play: 0, total: 0 };

      if (pet.stage === 'egg') {
        pet.growth = Number(pet.growth || 0) + 1;
        if (pet.growth >= (pet.maxGrowth || 5)) {
          const firstId = (slotIdx === 1 && slots[0]) ? slots[0].speciesId : '';
          const sp = rollSpecies(firstId);
          pet.stage = 'pet';
          pet.speciesId = sp.id;
          pet.speciesName = sp.name;
          pet.icon = sp.icon;
          pet.rarity = sp.rarity;
          pet.careCount = 1;
          pet.lastAction = action;
          pet.streak = 1;
          hatchedNow = sp;
          speech = '咔啦咔啦——「' + sp.name + ' ' + sp.icon + '」破殼出生啦！主人請多多指教！';
        } else {
          const left = (pet.maxGrowth || 5) - pet.growth;
          speech = '蛋殼輕輕搖晃了一下！還差 ' + left + ' 點成長值就會破殼囉～';
        }
        pet.lastSpeech = speech;
        slots[slotIdx] = pet;
        return { slots };
      }

      // 已孵化小寵物的記憶與反應
      const actKey = (action === 'feed' || action === 'pet' || action === 'play') ? action : 'pet';
      const actNameMap = { feed: '餵食點心', pet: '溫柔摸頭', play: '開心陪玩' };
      const prevAct = pet.lastAction || '';
      const sameAct = (prevAct === actKey);
      pet.streak = sameAct ? (Number(pet.streak || 0) + 1) : 1;
      pet.lastAction = actKey;
      pet.careCount = Number(pet.careCount || 0) + 1;

      const prevCountOfThis = Number(m[actKey] || 0);
      m[actKey] = prevCountOfThis + 1;
      m.total = Number(m.total || 0) + 1;
      m.name = actor.name;
      pet.memories[actorSeat] = m;

      if (actorSeat !== ownerSeat) {
        // 同學友善串門子反應
        if (m.total === 1) {
          speech = '哇！是 ' + actorSeat + ' 號 ' + actor.name + ' 第一次來找我玩，還幫我' + actNameMap[actKey] + '，好開心！';
        } else {
          speech = actorSeat + ' 號 ' + actor.name + ' 又來串門子啦！你已經幫我照顧 ' + m.total + ' 次了，最喜歡你！';
        }
      } else {
        // 主人互動記憶反應
        if (pet.streak >= 3) {
          speech = '主人～你連續 ' + pet.streak + ' 次都幫我「' + actNameMap[actKey] + '」了，我超喜歡這招，但下次也可以試試別的互動喔！';
        } else if (!sameAct && prevAct) {
          speech = '咦？主人今天換成「' + actNameMap[actKey] + '」了！每次都有新鮮感，幸福度大提升 ❤️';
        } else if (prevCountOfThis >= 3) {
          speech = '我就知道主人最擅長「' + actNameMap[actKey] + '」了（第 ' + m[actKey] + ' 次）！有你真好～';
        } else {
          speech = '謝謝主人的「' + actNameMap[actKey] + '」！我感覺自己又長大了一點點 ✨';
        }
      }

      pet.lastSpeech = speech;
      slots[slotIdx] = pet;
      return { slots };
    });

    if (!tx.committed) throw new Error('操作未完成，請再試一次');

    // 扣除花費積分
    await fbPut('scores/' + actorSeat, SV_INC(-cost));

    // 若非領蛋/開第二格，則有機率觸發「事件卡片」（45% 機率）
    let bonusPts = 0;
    let bonusDraw = false;
    if (action !== 'adopt' && action !== 'unlock2' && Math.random() < 0.45) {
      const EVENTS = [
        { title:'🍀 幸運草奇遇卡', desc:'小寵物在草叢發現一顆閃亮星星，立刻送給你！', pts: 1, draw: false },
        { title:'💎 尋寶大發現卡', desc:'小寵物挖到埋藏的寶石箱，直接回贈 +2 顆星星！', pts: 2, draw: false },
        { title:'⭐ 幸運星祝福卡', desc:'小寵物向流星許願，送你「額外 1 次今日星星抽獎機會」！', pts: 0, draw: true },
        { title:'💌 暖心感謝卡', desc:'小寵物把你的照顧記在心裡，偷偷塞給你 +1 顆星星當回禮！', pts: 1, draw: false },
        { title:'🌈 彩虹好心情卡', desc:'全班氣氛超棒！小寵物開心轉圈圈，送你 +2 顆星星！', pts: 2, draw: false }
      ];
      eventCard = EVENTS[Math.floor(Math.random() * EVENTS.length)];
      if (eventCard.pts > 0) {
        bonusPts = eventCard.pts;
        await fbPut('scores/' + actorSeat, SV_INC(bonusPts));
      }
      if (eventCard.draw) {
        bonusDraw = true;
        await fbPut('lotteryQuota/' + getTodayTaipei() + '/' + actorSeat, SV_INC(1));
      }
    }

    // 寫入加減分紀錄讓老師看得到
    const netDelta = -cost + bonusPts;
    const reasonTxt = action === 'adopt' ? '🥚 領養第一顆神祕蛋'
      : action === 'unlock2' ? '🏡 開啟第二隻寵物空間'
      : (actorSeat === ownerSeat ? '🐾 照顧自己的小寵物' : '🤝 串門子照顧 ' + ownerSeat + '號寵物') + (bonusPts ? '（觸發事件回禮 +' + bonusPts + '）' : '');
    await fbTxn('pointLogs', old => [{ seat: actorSeat, name: actor.name, delta: netDelta, reason: reasonTxt, ts: Date.now() }].concat(Array.isArray(old) ? old.filter(Boolean) : []).slice(0, 30));

    const newScore = Number(await fbGet('scores/' + actorSeat)) || 0;
    return {
      ok: true,
      newScore,
      slots: tx.value.slots,
      speech,
      hatchedNow,
      eventCard,
      bonusDraw
    };
  }

  if (fn === 'saveStudents') {
    const list = args[0] || [];
    await fbPut('students', list);
    return { ok: true };
  }

  throw new Error('未知指令: ' + fn);
}

function errMsg(e){ return (e && e.message) ? String(e.message).replace(/^Error:\s*/,'') : String(e||'發生錯誤'); }
function handleErr(e){ toast(errMsg(e)); }
let toastT;
function toast(msg){
  const t = $('#toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toastT); toastT = setTimeout(()=>t.classList.remove('show'), 2800);
}
function enqueue(fn, args){
  S.pending++; S.writeSeq++; S.lastWrite = Date.now();
  S.queue = S.queue.then(()=>gs.apply(null,[fn].concat(args)))
    .then(()=>{ S.pending--; S.lastWrite = Date.now(); })
    .catch(e=>{ S.pending--; handleErr(e); fetchBoard(true); });
  return S.queue;
}

/* ---------- 連點座號自動合併批次送出（250ms 防抖） ---------- */
function flushStatusBuffer(){
  clearTimeout(S.batchTimer);
  S.batchTimer = null;
  const keys = Object.keys(S.batchBuffer);
  if (!keys.length) return Promise.resolve();
  const payloadList = keys.map(k => S.batchBuffer[k]);
  S.batchBuffer = {};
  return enqueue('setStatusBatch', [payloadList]);
}

function queueStatusBatch(payloadList){
  S.writeSeq++;
  S.lastWrite = Date.now();
  payloadList.forEach(p => {
    const k = p.due + '|' + p.source + '|' + p.name + '|' + p.seat;
    S.batchBuffer[k] = p;
  });
  clearTimeout(S.batchTimer);
  S.batchTimer = setTimeout(() => { flushStatusBuffer(); }, 250);
}

function icon(status, seat){
  if (status === 'done')
    return '<svg class="tick" viewBox="0 0 60 60" aria-hidden="true"><path d="M9 32 L25 48 L52 13" fill="none" stroke="#3E3A39" stroke-width="15" stroke-linecap="round" stroke-linejoin="round"/><path d="M9 32 L25 48 L52 13" fill="none" stroke="#6DB04F" stroke-width="8.5" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  if (status === 'unsubmitted') return '<span class="bw"><span class="badge red">'+seat+'</span></span>';
  if (status === 'correction')  return '<span class="bw"><span class="badge blue">'+seat+'</span></span>';
  if (status === 'corrected')
    return '<span class="bw"><span class="badge blue">'+seat+'</span><svg class="xmark" viewBox="0 0 100 100" aria-hidden="true"><path d="M14 14 L86 86 M86 14 L14 86" stroke="#3E3A39" stroke-width="17" stroke-linecap="round"/><path d="M14 14 L86 86 M86 14 L14 86" stroke="#D9453D" stroke-width="9" stroke-linecap="round"/></svg></span>';
  return '<span class="none">—</span>';
}
const skey = (it, seat) => it.source+'|'+it.name+'|'+seat;

function drawAllowance(b, seat){
  if (!b || b.date !== b.today) return 0;
  const regularItems = b.items.filter(it => !it.temp);
  const hwCompleted = b.weekday && regularItems.length > 0 &&
    regularItems.every(it => {
      const t = b.status[skey(it, seat)];
      return t === 'done' || t === 'corrected';
    }) &&
    !b.carry.some(g => g.entries.some(e => e.seat === seat));
  const extra = (b.lotteryExtraQuota && Number(b.lotteryExtraQuota[seat])) || 0;
  return (hwCompleted ? 1 : 0) + extra;
}
function canDraw(seat){
  const b = S.board; if (!b) return false;
  const used = (b.lotteryUsedCount && Number(b.lotteryUsedCount[seat])) || 0;
  return drawAllowance(b, seat) > used;
}

function dotBusy(on){ $('#dot').classList.toggle('busy', on); }
async function fetchBoard(force){
  if (!force && (S.pending > 0 || S.batchTimer || Date.now() - S.lastWrite < 2000)) return;
  if (S.fetching) return;
  S.fetching = true; dotBusy(true);
  const w = S.writeSeq;
  try {
    const b = await gs('getBoard', S.viewDate);
    if (w !== S.writeSeq || S.pending > 0 || S.batchTimer) return;
    const j = JSON.stringify(b);
    S.online = true;
    $('#dot').classList.remove('off');
    $('#syncTxt').textContent = 'Firebase 即時同步 ' + nowTime();
    if (!S.viewDate) saveLocalSnap(j);
    if (j !== S.lastJson) { S.lastJson = j; S.board = b; renderAll(); }
  } catch(e) {
    S.online = false;
    $('#dot').classList.add('off');
    $('#syncTxt').textContent = '連線異常：' + errMsg(e);
    if (!S.board) $('#tblWrap').innerHTML = '<div class="empty"><svg><use href="#i-cloud"/></svg><p>'+esc(errMsg(e))+'</p></div>';
  } finally { S.fetching = false; dotBusy(false); }
}

/* =====================================================
 * 星星抽獎（內建 10 種 + 外部 plugins.js 動態擴充）
 * ===================================================== */
function initScratchPad(seat){
  const canvas = $('#scratchCanvas');
  if (!canvas) return;
  const ctx = canvas.getContext('2d');
  const W = canvas.width = 270, H = canvas.height = 130;
  ctx.fillStyle = '#C5C9CE';
  ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = '#A8AEB5';
  for (let x = -H; x < W + H; x += 22) {
    ctx.beginPath();
    ctx.moveTo(x, 0); ctx.lineTo(x + 10, 0);
    ctx.lineTo(x - H + 10, H); ctx.lineTo(x - H, H);
    ctx.closePath(); ctx.fill();
  }
  ctx.fillStyle = '#3E3A39';
  ctx.font = 'bold 20px sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText('✨ 用手指刮開銀漆 ✨', W / 2, H / 2 + 7);

  let drawing = false, fetched = false, revealed = false;

  async function ensureScore(){
    if (fetched) return;
    fetched = true;
    S.lottoBusy = true;
    $('#lottoMsg').textContent = '刮開中，揭曉幸運分數…';
    try {
      const res = await gs('drawLottery', S.board.date, seat);
      if (res && (res.ok || res.already)) {
        $('#scratchPts').textContent = '+' + res.points + ' 分';
        canvas._lottoRes = res;
      }
    } catch(e) {
      $('#lottoMsg').textContent = errMsg(e);
    }
    S.lottoBusy = false;
  }

  function scratchAt(clientX, clientY){
    if (revealed) return;
    const rect = canvas.getBoundingClientRect();
    const x = (clientX - rect.left) * (W / rect.width);
    const y = (clientY - rect.top) * (H / rect.height);
    ctx.globalCompositeOperation = 'destination-out';
    ctx.beginPath();
    ctx.arc(x, y, 22, 0, Math.PI * 2);
    ctx.fill();
    ensureScore();
    checkPercent();
  }

  function checkPercent(){
    if (revealed || !canvas._lottoRes) return;
    const data = ctx.getImageData(0, 0, W, H).data;
    let clear = 0;
    for (let i = 3; i < data.length; i += 16) {
      if (data[i] === 0) clear++;
    }
    if (clear / (data.length / 16) > 0.42) {
      revealed = true;
      canvas.style.transition = 'opacity .35s';
      canvas.style.opacity = '0';
      finishLottoState(seat, canvas._lottoRes);
    }
  }

  canvas.addEventListener('pointerdown', e => { drawing = true; scratchAt(e.clientX, e.clientY); });
  canvas.addEventListener('pointermove', e => { if (drawing) scratchAt(e.clientX, e.clientY); });
  canvas.addEventListener('pointerup', () => { drawing = false; checkPercent(); });
  canvas.addEventListener('pointerleave', () => { drawing = false; });
  canvas.addEventListener('pointercancel', () => { drawing = false; });
}

function closeLotto(){
  if (S.lottoBusy) return;
  $('#lottoOv').classList.remove('show');
  S.lottoSeat = null;
}

function finishLottoState(seat, res){
  if (!S.board.lotteryToday) S.board.lotteryToday = {};
  if (!S.board.lotteryUsedCount) S.board.lotteryUsedCount = {};
  if (!S.board.scoreTotal) S.board.scoreTotal = {};
  S.board.lotteryToday[seat] = res.todayTotal != null ? res.todayTotal : ((S.board.lotteryToday[seat] || 0) + res.points);
  S.board.lotteryUsedCount[seat] = res.usedCount != null ? res.usedCount : ((S.board.lotteryUsedCount[seat] || 0) + 1);
  S.board.scoreTotal[seat] = res.total;
  S.lastJson = '';
  saveLocalSnap(JSON.stringify(S.board));
  renderLeft();
  $('#lottoMsg').innerHTML = (res.already ? '今天的抽獎機會已經用完囉！' : '🎉 恭喜獲得 <b>+'+res.points+' 分</b>！') +
    '<br>目前總積分：<b>'+res.total+' 分</b>';
  $('#lottoClose').textContent = '太棒了！';
}

$('#tblWrap').addEventListener('click', ev=>{
  const btn = ev.target.closest('[data-draw]');
  if (!btn || !S.board) return;
  const seat = +btn.dataset.draw;
  if (canDraw(seat)) openLotto(seat);
});
$('#lottoClose').addEventListener('click', closeLotto);

$('#lottoGame').addEventListener('click', async ev=>{
  if (S.lottoBusy || !S.lottoSeat || !S.board) return;
  const seat = S.lottoSeat;

  /* 0：掀牌 */
  const cardBtn = ev.target.closest('[data-lcard]');
  if (cardBtn) {
    S.lottoBusy = true;
    const pickedIdx = +cardBtn.dataset.lcard;
    const allCards = [...document.querySelectorAll('.lcard')];
    allCards.forEach(b => b.disabled = true);
    cardBtn.classList.add('picked');
    $('#lottoMsg').textContent = '掀開卡片中…';
    try {
      const [res] = await Promise.all([gs('drawLottery', S.board.date, seat), new Promise(r => setTimeout(r, 450))]);
      if (res && (res.ok || res.already)) {
        const others = [1, 2, 3].filter(n => n !== res.points);
        let oi = 0;
        allCards.forEach((b, idx) => {
          if (idx === pickedIdx) b.innerHTML = '<div class="cpts">+'+res.points+'</div><span>恭喜獲得</span>';
          else { b.classList.add('dim'); b.innerHTML = '<div style="font-size:24px;font-weight:700">+'+others[oi++]+'</div><span>未選中</span>'; }
        });
        finishLottoState(seat, res);
      }
    } catch(e) { $('#lottoMsg').textContent = errMsg(e); allCards.forEach(b => b.disabled = false); }
    S.lottoBusy = false;
    return;
  }

  /* 1：拉霸 */
  if (ev.target.closest('#slotPull')) {
    S.lottoBusy = true;
    const pullBtn = $('#slotPull'); pullBtn.disabled = true;
    $('#lottoMsg').textContent = '拉霸轉動中…';
    const reels = [$('#reel0'), $('#reel1'), $('#reel2')];
    const syms = ['⭐','🌙','☁️','⛵','🐦','+1','+2','+3'];
    let tick = 0;
    const iv = setInterval(()=>{
      tick++;
      reels.forEach((r, idx) => { if (!r.dataset.done) r.textContent = syms[(tick + idx * 3) % syms.length]; });
    }, 85);
    try {
      const res = await gs('drawLottery', S.board.date, seat);
      await new Promise(r => setTimeout(r, 500));
      if (res && (res.ok || res.already)) {
        for (let k = 0; k < 3; k++) {
          reels[k].dataset.done = '1';
          reels[k].innerHTML = '<span style="color:var(--red)">+'+res.points+'</span>';
          if (k < 2) await new Promise(r => setTimeout(r, 200));
        }
        clearInterval(iv);
        finishLottoState(seat, res);
      } else clearInterval(iv);
    } catch(e) { clearInterval(iv); $('#lottoMsg').textContent = errMsg(e); pullBtn.disabled = false; }
    S.lottoBusy = false;
    return;
  }

  /* 2：滾珠珠 */
  if (ev.target.closest('#wheelSpin')) {
    S.lottoBusy = true;
    const spinBtn = $('#wheelSpin'); spinBtn.disabled = true;
    const drum = $('#wheelDrum'); drum.classList.add('spinning');
    $('#lottoMsg').textContent = '轉盤旋轉中，珠珠即將滾出…';
    try {
      const [res] = await Promise.all([gs('drawLottery', S.board.date, seat), new Promise(r => setTimeout(r, 950))]);
      drum.classList.remove('spinning');
      if (res && (res.ok || res.already)) {
        $('#wheelChute').innerHTML = '<div class="gacha-ball">+'+res.points+'</div>';
        finishLottoState(seat, res);
      }
    } catch(e) { drum.classList.remove('spinning'); $('#lottoMsg').textContent = errMsg(e); spinBtn.disabled = false; }
    S.lottoBusy = false;
    return;
  }

  /* 3：抽繩結 */
  const ropeBtn = ev.target.closest('[data-rope]');
  if (ropeBtn) {
    S.lottoBusy = true;
    const pickedIdx = +ropeBtn.dataset.rope;
    const allRopes = [...document.querySelectorAll('.rope-btn')];
    allRopes.forEach(b => b.disabled = true);
    ropeBtn.classList.add('pulled');
    $('#lottoMsg').textContent = '用力拉出繩結中…';
    try {
      const [res] = await Promise.all([gs('drawLottery', S.board.date, seat), new Promise(r => setTimeout(r, 500))]);
      if (res && (res.ok || res.already)) {
        const others = [1, 2, 3].filter(n => n !== res.points);
        let oi = 0;
        allRopes.forEach((b, idx) => {
          const knot = b.querySelector('.rope-knot');
          if (idx === pickedIdx) knot.textContent = '+' + res.points + '分';
          else { b.classList.add('dim'); knot.textContent = '+' + others[oi++]; }
        });
        finishLottoState(seat, res);
      }
    } catch(e) { $('#lottoMsg').textContent = errMsg(e); allRopes.forEach(b => { b.disabled = false; b.classList.remove('pulled'); }); }
    S.lottoBusy = false;
    return;
  }

  /* 5：套圈圈 */
  if (ev.target.closest('#ringThrow')) {
    S.lottoBusy = true;
    const throwBtn = $('#ringThrow'); throwBtn.disabled = true;
    $('#ringPosts').classList.add('paused');
    $('#lottoMsg').textContent = '圈圈飛出去啦…';
    try {
      const [res] = await Promise.all([gs('drawLottery', S.board.date, seat), new Promise(r => setTimeout(r, 450))]);
      if (res && (res.ok || res.already)) {
        const winPost = Math.floor(Math.random() * 3);
        const others = [1, 2, 3].filter(n => n !== res.points);
        let oi = 0;
        [0,1,2].forEach(i => {
          $('#rcap' + i).textContent = '+' + (i === winPost ? res.points : others[oi++]) + '分';
        });
        const hoop = $('#ringHoop');
        hoop.classList.add('landed');
        $('#rpost' + winPost).appendChild(hoop);
        $('#rcap' + winPost).style.background = 'var(--coral)';
        finishLottoState(seat, res);
      }
    } catch(e) { $('#lottoMsg').textContent = errMsg(e); throwBtn.disabled = false; }
    S.lottoBusy = false;
    return;
  }

  /* 6：投籃 */
  if (ev.target.closest('#shootBall')) {
    S.lottoBusy = true;
    const shootBtn = $('#shootBall'); shootBtn.disabled = true;
    $('#bball').classList.add('shoot');
    $('#lottoMsg').textContent = '漂亮拋物線飛向籃框…';
    try {
      const [res] = await Promise.all([gs('drawLottery', S.board.date, seat), new Promise(r => setTimeout(r, 650))]);
      if (res && (res.ok || res.already)) {
        const sc = $('#hoopScore');
        sc.textContent = '空心入網 +' + res.points + ' 分！';
        sc.style.display = 'block';
        finishLottoState(seat, res);
      }
    } catch(e) { $('#lottoMsg').textContent = errMsg(e); shootBtn.disabled = false; }
    S.lottoBusy = false;
    return;
  }

  /* 7：射擊 */
  const targetBtn = ev.target.closest('[data-target]');
  if (targetBtn) {
    S.lottoBusy = true;
    const pickedIdx = +targetBtn.dataset.target;
    const allTargets = [...document.querySelectorAll('.target-btn')];
    allTargets.forEach(b => b.disabled = true);
    $('#lottoMsg').textContent = '砰！子彈飛向標靶…';
    try {
      const [res] = await Promise.all([gs('drawLottery', S.board.date, seat), new Promise(r => setTimeout(r, 400))]);
      if (res && (res.ok || res.already)) {
        const others = [1, 2, 3].filter(n => n !== res.points);
        let oi = 0;
        allTargets.forEach((b, idx) => {
          if (idx === pickedIdx) { b.classList.add('hit'); b.textContent = '+' + res.points + '分'; }
          else { b.classList.add('dim'); b.textContent = '+' + others[oi++]; }
        });
        finishLottoState(seat, res);
      }
    } catch(e) { $('#lottoMsg').textContent = errMsg(e); allTargets.forEach(b => b.disabled = false); }
    S.lottoBusy = false;
    return;
  }

  /* 8：摘蘋果 */
  const appleBtn = ev.target.closest('[data-apple]');
  if (appleBtn) {
    S.lottoBusy = true;
    const pickedIdx = +appleBtn.dataset.apple;
    const allApples = [...document.querySelectorAll('.apple-btn')];
    allApples.forEach(b => b.disabled = true);
    appleBtn.classList.add('picked');
    $('#lottoMsg').textContent = '摘下紅蘋果囉…';
    try {
      const [res] = await Promise.all([gs('drawLottery', S.board.date, seat), new Promise(r => setTimeout(r, 550))]);
      if (res && (res.ok || res.already)) {
        allApples.forEach((b, idx) => {
          if (idx === pickedIdx) b.textContent = '+' + res.points + '分';
          else b.classList.add('dim');
        });
        finishLottoState(seat, res);
      }
    } catch(e) { $('#lottoMsg').textContent = errMsg(e); allApples.forEach(b => { b.disabled = false; b.classList.remove('picked'); }); }
    S.lottoBusy = false;
    return;
  }

  /* 9：撈魚 */
  const fishBtn = ev.target.closest('[data-fish]');
  if (fishBtn) {
    S.lottoBusy = true;
    const pickedIdx = +fishBtn.dataset.fish;
    const allFish = [...document.querySelectorAll('.fish-btn')];
    allFish.forEach(b => b.disabled = true);
    $('#lottoMsg').textContent = '網子下水撈魚中…';
    try {
      const [res] = await Promise.all([gs('drawLottery', S.board.date, seat), new Promise(r => setTimeout(r, 450))]);
      if (res && (res.ok || res.already)) {
        allFish.forEach((b, idx) => {
          if (idx === pickedIdx) { b.classList.add('caught'); b.textContent = '🥅 +' + res.points + '分'; }
          else b.classList.add('dim');
        });
        finishLottoState(seat, res);
      }
    } catch(e) { $('#lottoMsg').textContent = errMsg(e); allFish.forEach(b => b.disabled = false); }
    S.lottoBusy = false;
  }
});



/* =====================================================
 * 🐾 班級電子寵物樂園（盲盒領蛋 / 記憶反應 / 友善串門子 / 事件卡）
 * ===================================================== */
const PetUI = {
  actorSeat: null,
  tab: 'my', // 'my' | 'street'
  busy: false
};

function getPetSlots(seat){
  const petsMap = (S.board && S.board.pets) || {};
  const rec = petsMap[seat] || {};
  if (Array.isArray(rec.slots)) return rec.slots.filter(Boolean);
  if (rec.slots && typeof rec.slots === 'object') return Object.values(rec.slots).filter(Boolean);
  return [];
}

function openPetPark(){
  const b = S.board;
  if (!b || !b.students || !b.students.length) {
    toast('尚未設定班級名單');
    return;
  }
  if (!PetUI.actorSeat || !b.students.some(s => s.seat === PetUI.actorSeat)) {
    PetUI.actorSeat = b.students[0].seat;
  }
  $('#petActorSel').innerHTML = b.students.map(s =>
    '<option value="'+s.seat+'"'+(s.seat===PetUI.actorSeat?' selected':'')+'>我是：'+s.seat+' 號 '+esc(s.name)+'</option>'
  ).join('');
  $('#petEventBox').innerHTML = '';
  renderPetPark();
  $('#petOv').classList.add('show');
}

function renderPetPark(){
  const b = S.board; if (!b) return;
  const actor = PetUI.actorSeat;
  const myPts = (b.scoreTotal && Number(b.scoreTotal[actor])) || 0;
  $('#petMyPts').textContent = '⭐ 擁有星星：' + myPts + ' 分';

  document.querySelectorAll('.pet-nav-btn').forEach(btn => {
    btn.classList.toggle('on', btn.dataset.pettab === PetUI.tab);
  });

  const body = $('#petBody');
  const mySlots = getPetSlots(actor);
  const myHasHatched = mySlots.some(p => p && p.stage === 'pet');

  if (PetUI.tab === 'my') {
    let h = '<div class="pet-slots">';
    h += renderSlotCard(actor, 0, mySlots[0], myPts, true);
    h += renderSlotCard(actor, 1, mySlots[1], myPts, myHasHatched);
    h += '</div>';
    body.innerHTML = h;
  } else if (PetUI.tab === 'shop') {
    body.innerHTML = renderPetShop(actor, mySlots, myPts);
  } else {
    // 班級寵物街（串門子）
    let h = '';
    if (!myHasHatched) {
      h += '<div class="note" style="background:#FFF3C4;padding:10px 14px;border-radius:14px;border:2px solid var(--ink)">🥚 <b>串門子小提醒：</b>要等<b>你自己的第一隻小寵物破殼出生</b>之後，才可以去同學家串門子、做友好互動喔！</div>';
    } else {
      h += '<div class="note">點選同學已出生的小寵物，花 <b>1 顆星星</b>做友好互動（餵食／摸頭／陪玩），小寵物會記住你的名字，還有機會送你事件卡片回禮！</div>';
    }
    h += '<div class="pet-street">';
    b.students.forEach(s => {
      if (s.seat === actor) return;
      const slots = getPetSlots(s.seat);
      const p = slots[0];
      if (!p) {
        h += '<div class="street-item egg-only"><div class="street-who">'+s.seat+' 號 '+esc(s.name)+'</div><div class="street-ic">🏠</div><div class="street-pet">尚未領養神祕蛋</div></div>';
      } else if (p.stage === 'egg') {
        h += '<div class="street-item egg-only"><div class="street-who">'+s.seat+' 號 '+esc(s.name)+'</div><div class="street-ic">'+(p.eggIcon||'🥚')+'</div><div class="street-pet">神祕蛋孵化中 ('+(p.growth||0)+'/5)</div></div>';
      } else {
        const mem = (p.memories && p.memories[actor]) ? p.memories[actor].total : 0;
        const dis = (!myHasHatched || myPts < 1) ? ' disabled' : '';
        h += '<div class="street-item">'+
          '<div class="street-who">'+s.seat+' 號 '+esc(s.name)+'</div>'+
          '<div class="street-ic" style="position:relative;display:inline-block">'+p.icon+(p.equippedAcc?'<span style="position:absolute;top:-8px;right:-12px;font-size:22px">'+p.equippedAcc+'</span>':'')+'</div>'+
          '<div class="street-pet">'+esc(p.speciesName)+(mem?' · 友好度 '+mem:'')+'</div>'+
          '<div class="street-btns">'+
            '<button type="button" data-pact="feed" data-owner="'+s.seat+'" data-slot="0"'+dis+'>🍎 餵食</button>'+
            '<button type="button" data-pact="pet" data-owner="'+s.seat+'" data-slot="0"'+dis+'>✋ 摸頭</button>'+
            '<button type="button" data-pact="play" data-owner="'+s.seat+'" data-slot="0"'+dis+'>⚽ 陪玩</button>'+
          '</div></div>';
      }
    });
    h += '</div>';
    body.innerHTML = h;
  }
}

function renderSlotCard(ownerSeat, slotIdx, pet, myPts, canUnlock){
  if (!pet) {
    if (slotIdx === 0) {
      const ok = myPts >= 10;
      return '<div class="pet-card locked">'+
        '<div style="font-size:64px;margin-bottom:8px">🎁🥚</div>'+
        '<div class="pet-name">第一顆盲盒神祕蛋</div>'+
        '<div class="pet-sub">累積滿 <b>10 顆星星</b> 即可領養專屬蛋，孵化出隨機可愛生物！</div>'+
        '<button type="button" class="btn green" data-pact="adopt" data-owner="'+ownerSeat+'" data-slot="0"'+(ok?'':' disabled')+'>'+
        (ok ? '✨ 花 10 顆星星領養蛋' : '還差 '+(10-myPts)+' 顆星星')+'</button></div>';
    } else {
      const ok = canUnlock && myPts >= 25;
      return '<div class="pet-card locked">'+
        '<div style="font-size:58px;margin-bottom:8px">🏡🔒</div>'+
        '<div class="pet-name">第二隻寵物擴充空間</div>'+
        '<div class="pet-sub">'+(canUnlock ? '花費 <b>25 顆星星</b> 購買第二隻寵物空間，領養第二顆盲盒蛋！' : '需先讓第一隻小寵物破殼出生後才能開啟')+'</div>'+
        '<button type="button" class="btn sky" data-pact="unlock2" data-owner="'+ownerSeat+'" data-slot="1"'+(ok?'':' disabled')+'>'+
        (!canUnlock ? '尚未解鎖' : (ok ? '🏡 花 25 顆星星購買空間' : '還差 '+(25-myPts)+' 顆星星'))+'</button></div>';
    }
  }

  if (pet.stage === 'egg') {
    const g = Number(pet.growth || 0);
    const maxG = Number(pet.maxGrowth || 5);
    const pct = Math.min(100, Math.round((g / maxG) * 100));
    const dis = myPts < 1 ? ' disabled' : '';
    return '<div class="pet-card">'+
      '<span class="pet-stage-tag">第 '+(slotIdx+1)+' 格 · 孵化中</span>'+
      '<div class="pet-avatar egg">'+(pet.eggIcon||'🥚')+'</div>'+
      '<div class="pet-name">盲盒神祕蛋（'+g+' / '+maxG+'）</div>'+
      '<div class="pet-prog-wrap"><div class="pet-prog-bar" style="width:'+pct+'%"></div></div>'+
      '<div class="pet-speech">'+esc(pet.lastSpeech || '用星星照顧我，我就會破殼出生喔！')+'</div>'+
      '<div class="pet-acts">'+

  const eqBtn = ev.target.closest('[data-pequip]');

    try {
      const res = await gs('petAction', PetUI.actorSeat, Number(eqBtn.dataset.owner), Number(eqBtn.dataset.slot), 'equip_acc', eqBtn.dataset.pequip);
      if (res && res.ok) {

        saveLocalSnap(JSON.stringify(S.board));

  const actorSeat = PetUI.actorSeat;

  PetUI.busy = true;
  btn.disabled = true;
  $('#petEventBox').innerHTML = '';

  try {
    const res = await gs('petAction', actorSeat, ownerSeat, slotIdx, act);
    if (res && res.ok) {
      if (!S.board.scoreTotal) S.board.scoreTotal = {};
      if (!S.board.pets) S.board.pets = {};
      S.board.scoreTotal[actorSeat] = res.newScore;
      S.board.pets[ownerSeat] = { slots: res.slots };
      if (res.bonusDraw) {
        if (!S.board.lotteryExtraQuota) S.board.lotteryExtraQuota = {};
        S.board.lotteryExtraQuota[actorSeat] = Number(S.board.lotteryExtraQuota[actorSeat] || 0) + 1;
        renderLeft();
      }
      S.writeSeq++; S.lastJson = '';
      saveLocalSnap(JSON.stringify(S.board));
      renderPetPark();

        bannerHtml += '<div class="event-banner"><h4>🎉 恭喜盲盒孵化成功！</h4><p>誕生了【<b>'+res.hatchedNow.rarity+'</b>】<b>'+res.hatchedNow.icon+' '+esc(res.hatchedNow.name)+'</b>！現在可以去「班級寵物街」串門子囉！</p></div>';

  }
  if (PetUI.shopSlot == null || !mySlots[PetUI.shopSlot] || mySlots[PetUI.shopSlot].stage !== 'pet') {

  }

  const catalog = [
    { id:'acc_bow',     type:'acc',   icon:'🎀', name:'粉紅蝴蝶結',   cost:5,  desc:'可愛度破表的經典造型' },
    { id:'acc_scarf',   type:'acc',   icon:'🧣', name:'暖呼呼圍巾',   cost:6,  desc:'冬天保暖氣質大加分' },
    { id:'acc_glasses', type:'acc',   icon:'🕶️', name:'酷炫太陽眼鏡', cost:7,  desc:'秒變全班最潮明星寵物' },
    { id:'acc_crown',   type:'acc',   icon:'👑', name:'閃亮小皇冠',   cost:8,  desc:'戴在頭上超威風！' },

    { id:'snack_star',  type:'snack', icon:'🍭', name:'彩虹棒棒糖',   cost:2,  desc:'甜蜜點心！照顧次數 +2' },
    { id:'snack_cake',  type:'snack', icon:'🍰', name:'草莓鮮奶油蛋糕', cost:3, desc:'高級大餐！照顧次數 +3' }
  ];

  h += '<div class="shop-grid">';

/* =====================================================
 * ⏱️ 課堂視覺倒數計時器（含溫和風鈴提示音）
 * ===================================================== */
const TimerUI = {
  totalSec: 300,
  remainSec: 300,
  label: '📖 安靜自習時間',
  running: false,
  iv: null
};

function playChime(){
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const notes = [523.25, 659.25, 783.99, 1046.5];
    notes.forEach((freq, idx) => {
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = 'sine';
      osc.frequency.value = freq;
      const start = ctx.currentTime + idx * 0.22;
      gain.gain.setValueAtTime(0.001, start);
      gain.gain.exponentialRampToValueAtTime(0.28, start + 0.04);
      gain.gain.exponentialRampToValueAtTime(0.001, start + 1.1);
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start(start);
      osc.stop(start + 1.15);
    });
  } catch(e){}
}

function renderTimer(){
  const m = Math.floor(TimerUI.remainSec / 60);
  const s = TimerUI.remainSec % 60;
  $('#timerDigits').textContent = String(m).padStart(2,'0') + ':' + String(s).padStart(2,'0');
  $('#timerTag').textContent = TimerUI.label;

  const CIRC = 653.45;
  const ratio = TimerUI.totalSec > 0 ? (TimerUI.remainSec / TimerUI.totalSec) : 0;
  const fg = $('#timerRingFg');
  fg.style.strokeDashoffset = String(CIRC * (1 - ratio));
  fg.classList.remove('warn', 'urgent');
  if (TimerUI.remainSec <= 15 && TimerUI.remainSec > 0) fg.classList.add('urgent');
  else if (ratio <= 0.3) fg.classList.add('warn');

  const btn = $('#timerStartBtn');
  if (TimerUI.running) {
    btn.textContent = '⏸ 暫停';
    btn.className = 'btn coral';
  } else {
    btn.textContent = TimerUI.remainSec === 0 ? '↺ 再來一次' : '▶ 開始';
    btn.className = 'btn green';
  }
}

function stopTimer(){
  TimerUI.running = false;
  clearInterval(TimerUI.iv);
  TimerUI.iv = null;
}

function setTimerMinutes(mins, label){
  stopTimer();
  const safeMin = Math.max(1, Math.min(60, Number(mins) || 5));
  TimerUI.totalSec = safeMin * 60;
  TimerUI.remainSec = TimerUI.totalSec;
  if (label) TimerUI.label = label;
  $('#timerCustomMin').value = safeMin;
  $('#timerModalBox').classList.remove('timer-done-shake');
  renderTimer();
}

$('#timerBtn').addEventListener('click', ()=>{
  renderTimer();
  $('#timerOv').classList.add('show');
});
$('#timerCloseBtn').addEventListener('click', ()=>{
  $('#timerOv').classList.remove('show');

$('#timerResetBtn').addEventListener('click', ()=>{
