});
$('#timerStartBtn').addEventListener('click', ()=>{
  if (TimerUI.running) {
    stopTimer();
    renderTimer();
    return;
  }
  if (TimerUI.remainSec <= 0) {
    TimerUI.remainSec = TimerUI.totalSec;
  }
  $('#timerModalBox').classList.remove('timer-done-shake');
  TimerUI.running = true;
  renderTimer();
  TimerUI.iv = setInterval(()=>{
    if (TimerUI.remainSec > 0) {
      TimerUI.remainSec--;
      renderTimer();
      if (TimerUI.remainSec === 0) {
        stopTimer();
        renderTimer();
        playChime();
        $('#timerModalBox').classList.add('timer-done-shake');
        toast('🔔 時間到囉！');
      }
    }
  }, 1000);
});

/* =====================================================
 * 連點右下角天空插圖兩下 -> 全班隨機抽籤點名活動（樂透滾球 / 抽籤 / 翻牌）
 * ===================================================== */
const PickState = {
  busy: false,
  mode: 0,       // 0: 樂透滾球, 1: 幸運抽籤筒, 2: 翻牌點點名
  winner: null,  // { seat, name }
  rewarded: false,
  history: new Set() // 記錄本輪已抽過的座號，優先抽未抽過的同學
};

function drawRandomStudent(){
  const b = S.board;
  if (!b || !b.students || !b.students.length) return null;
  let pool = b.students.filter(s => !PickState.history.has(s.seat));
  if (!pool.length) {
    PickState.history.clear();
    pool = b.students.slice();
  }
  const chosen = pool[Math.floor(Math.random() * pool.length)];
  PickState.history.add(chosen.seat);
  return chosen;
}

function openClassPick(){
  const b = S.board;
  if (!b || !b.students || !b.students.length) {
    toast('尚未設定班級名單，無法抽籤');
    return;
  }
  PickState.busy = false;
  PickState.winner = null;
  PickState.rewarded = false;
  PickState.mode = Math.floor(Math.random() * 3);

  const stage = $('#pickStage');
  const msg = $('#pickMsg');
  const acts = $('#pickActions');

  if (PickState.mode === 0) {
    $('#pickTtl').textContent = '🔮 樂透滾球抽點名';
    $('#pickModeTag').textContent = '模式：幸運樂透機';
    stage.innerHTML =
      '<div class="wheel-wrap" style="margin:0">'+
        '<div class="wheel-drum" id="pickDrum">'+
          '<span class="mini-b b1">1</span><span class="mini-b b2">8</span>'+
          '<span class="mini-b b3">15</span><span class="mini-b b4">⭐</span>'+
        '</div>'+
        '<div class="wheel-chute" id="pickChute">'+
          '<button type="button" class="btn green" id="pickRollBtn">轉動滾出幸運球 ✨</button>'+
        '</div>'+
      '</div>';
    msg.textContent = '按下按鈕轉動樂透機，看看哪位同學被抽中！';
  } else if (PickState.mode === 1) {
    $('#pickTtl').textContent = '🎋 幸運抽籤筒點名';
    $('#pickModeTag').textContent = '模式：神祕抽籤筒';
    stage.innerHTML =
      '<div class="tube-wrap">'+
        '<div class="tube-box" id="pickTube">'+
          '<div class="tube-stick" id="pickStick">？</div>'+
          '<div class="tube-body">幸運籤</div>'+
        '</div>'+
        '<button type="button" class="btn green" id="pickDrawStickBtn">搖一搖抽籤 🎋</button>'+
      '</div>';
    msg.textContent = '點擊「搖一搖抽籤」，抽出幸運上台回答的同學！';
  } else {
    $('#pickTtl').textContent = '🃏 翻牌點點名';
    $('#pickModeTag').textContent = '模式：三選一翻牌';
    const cardIcons = ['#i-bird', '#i-boat', '#i-star'];
    stage.innerHTML =
      '<div class="pick-cards">' + [0,1,2].map(i =>
        '<button type="button" class="pcard" data-pcard="'+i+'">'+
          '<svg style="width:52px;height:52px" aria-hidden="true"><use href="'+cardIcons[i]+'"/></svg>'+
          '<span style="font-size:18px;font-weight:700">第 '+(i+1)+' 張</span>'+
        '</button>'
      ).join('') + '</div>';
    msg.textContent = '請點選一張卡片翻開幸運同學！';
  }

  acts.innerHTML =
    '<button type="button" class="btn sky sm" id="pickSwitchMode">換一種玩法</button>'+
    '<button type="button" class="btn plain grow" id="pickCloseBtn">關閉</button>';
  $('#pickOv').classList.add('show');
}

function showPickWinnerActions(stu){
  PickState.winner = stu;
  $('#pickMsg').innerHTML = '🎉 恭喜 <b>' + stu.seat + ' 號 ' + esc(stu.name) + '</b> 中籤！';
  $('#pickActions').innerHTML =
    '<button type="button" class="btn green grow" id="pickCorrectBtn">⭕ 回答正確！抽 +1～+3 分</button>'+
    '<button type="button" class="btn sky sm" id="pickAgainBtn">再抽一位</button>'+
    '<button type="button" class="btn plain sm" id="pickCloseBtn">關閉</button>';
}

let skyTapCnt = 0, skyTapTimer = null;
$('#skyPickBtn').addEventListener('click', ()=>{
  skyTapCnt++;
  clearTimeout(skyTapTimer);
  if (skyTapCnt >= 2) {
    skyTapCnt = 0;
    openClassPick();
  } else {
    skyTapTimer = setTimeout(()=>{ skyTapCnt = 0; }, 700);
  }
});

$('#pickStage').addEventListener('click', async ev=>{
  if (PickState.busy || PickState.winner) return;

  /* 模式 0：樂透滾球 */
  if (ev.target.closest('#pickRollBtn')) {
    PickState.busy = true;
    const btn = $('#pickRollBtn'); btn.disabled = true;
    const drum = $('#pickDrum'); drum.classList.add('spinning');
    $('#pickMsg').textContent = '樂透滾球轉動中…';
    await new Promise(r => setTimeout(r, 950));
    drum.classList.remove('spinning');
    const stu = drawRandomStudent();
    $('#pickChute').innerHTML =
      '<div class="pick-winner"><div class="pw-seat">'+stu.seat+' 號</div><div class="pw-name">'+esc(stu.name)+'</div></div>';
    PickState.busy = false;
    showPickWinnerActions(stu);
    return;
  }

  /* 模式 1：抽籤筒 */
  if (ev.target.closest('#pickDrawStickBtn')) {
    PickState.busy = true;
    const btn = $('#pickDrawStickBtn'); btn.disabled = true;
    const tube = $('#pickTube'); tube.classList.add('shake');
    $('#pickMsg').textContent = '喀啦喀啦搖籤筒中…';
    await new Promise(r => setTimeout(r, 750));
    tube.classList.remove('shake');
    const stu = drawRandomStudent();
    const stick = $('#pickStick');
    stick.innerHTML = '<div style="text-align:center;line-height:1.2"><div style="font-size:15px">'+stu.seat+'號</div><div style="font-size:21px">'+esc(stu.name)+'</div></div>';
    stick.classList.add('out');
    PickState.busy = false;
    showPickWinnerActions(stu);
    return;
  }

  /* 模式 2：翻牌 */
  const cardBtn = ev.target.closest('[data-pcard]');
  if (cardBtn) {
    PickState.busy = true;
    const pickedIdx = +cardBtn.dataset.pcard;
    const allCards = [...document.querySelectorAll('.pcard')];
    allCards.forEach(b => b.disabled = true);
    cardBtn.classList.add('picked');
    $('#pickMsg').textContent = '翻開卡片中…';
    await new Promise(r => setTimeout(r, 420));
    const stu = drawRandomStudent();
    const otherPool = S.board.students.filter(s => s.seat !== stu.seat).sort(() => Math.random() - 0.5);
    let oi = 0;
    allCards.forEach((b, idx) => {
      if (idx === pickedIdx) {
        b.innerHTML = '<div class="pseat">'+stu.seat+' 號</div><div class="pname">'+esc(stu.name)+'</div>';
      } else {
        b.classList.add('dim');
        const os = otherPool[oi++] || stu;
        b.innerHTML = '<div style="font-size:18px;font-weight:700">'+os.seat+' 號</div><div style="font-size:15px">'+esc(os.name)+'</div>';
      }
    });
    PickState.busy = false;
    showPickWinnerActions(stu);
  }
});

$('#pickActions').addEventListener('click', async ev=>{
  if (PickState.busy) return;

  if (ev.target.closest('#pickCloseBtn')) {
    $('#pickOv').classList.remove('show');
    return;
  }
  if (ev.target.closest('#pickSwitchMode') || ev.target.closest('#pickAgainBtn')) {
    openClassPick();
    return;
  }
  if (ev.target.closest('#pickCorrectBtn')) {
    const stu = PickState.winner;
    if (!stu || PickState.rewarded) return;
    PickState.busy = true;
    PickState.rewarded = true;
    const btn = $('#pickCorrectBtn');
    btn.disabled = true;
    btn.textContent = '🎲 正在抽取 +1～+3 分…';

    const pts = Math.floor(Math.random() * 3) + 1;
    try {
      await gs('addPoints', [stu.seat], pts, '🎲 抽籤回答正確');
      if (!S.board.scoreTotal) S.board.scoreTotal = {};
      S.board.scoreTotal[stu.seat] = Number(S.board.scoreTotal[stu.seat] || 0) + pts;
      S.writeSeq++; S.lastJson = '';
      saveLocalSnap(JSON.stringify(S.board));
      $('#pickMsg').innerHTML = '🌟 太棒了！<b>' + stu.seat + ' 號 ' + esc(stu.name) + '</b> 獲得 <b style="color:var(--red);font-size:24px">+' + pts + ' 分</b>！<br>目前總積分：<b>' + S.board.scoreTotal[stu.seat] + ' 分</b>';
      btn.textContent = '✅ 已加 +' + pts + ' 分';
    } catch(e) {
      PickState.rewarded = false;
      btn.disabled = false;
      btn.textContent = '⭕ 回答正確！抽 +1～+3 分';
      handleErr(e);
    }
    PickState.busy = false;
  }
});

$('#secretPencil').addEventListener('click', ()=>{

$('#secretPencil').addEventListener('keydown', ev=>{

async function openAdmin(){
  S.adminOpen = true; S.viewDate = null; S.lastJson = ''; S.resetArm = false;
  document.body.classList.add('admin-open');
  bumpIdle();
  $('#adBody').innerHTML = '<div class="empty-ad">載入中…</div>';
  await fetchBoard(true);
  try { await loadWeek(null); } catch(e) { handleErr(e); }
  renderAdmin();
}
async function backToFront(){
  if (S.adminOpen) {
    try { await flushStatusBuffer(); } catch(e){}
    try { await saveAllDirty(); } catch(e){}
  }
  S.adminOpen = false;
  document.body.classList.remove('admin-open');
  S.viewDate = null; S.lastJson = ''; S.resetArm = false;
  clearTimeout(idleT);
  fetchBoard(true).then(()=>fitVertical());
}
$('#adBack').addEventListener('click', backToFront);
$('#adSync').addEventListener('click', async ()=>{
  await flushStatusBuffer();
  await saveAllDirty();
  await fetchBoard(true);
  if (S.tab === 'week') { try { await loadWeek(S.week && S.week.monday); } catch(e){ handleErr(e); } }
  renderAdmin(); toast('已同步 '+nowTime());
});

let idleT;
function bumpIdle(){ clearTimeout(idleT); if (S.adminOpen) idleT = setTimeout(()=>{ backToFront(); toast('閒置太久，已自動返回前台'); }, 15*60*1000); }
['pointerdown','keydown'].forEach(ev=>document.addEventListener(ev, bumpIdle, {passive:true}));

$('#tabs').addEventListener('click', async ev=>{
  const t = ev.target.closest('.tab'); if (!t) return;
  await flushStatusBuffer();
  if (S.tab === 'week' && t.dataset.tab !== 'week') await saveAllDirty();
  S.tab = t.dataset.tab; S.delArm = false; S.resetArm = false;
  if (S.tab === 'week' && !S.week) { try { await loadWeek(null); } catch(e){ handleErr(e); } }
  renderAdmin();
  $('#admin').scrollTop = 0;
});

function adminRefresh(){
  if (!S.adminOpen) return;
  const ae = document.activeElement;
  if (ae && ae.closest && ae.closest('#admin') && /INPUT|TEXTAREA|SELECT/.test(ae.tagName)) return;
  if (S.tab === 'register' || S.tab === 'track' || S.tab === 'points') renderAdmin();
}
function renderAdmin(){
  document.querySelectorAll('#tabs .tab').forEach(t=>t.classList.toggle('on', t.dataset.tab===S.tab));

/* ---------- 分頁一：一週排程 + 黑板便條 ---------- */
async function loadWeek(anchor){
  const w = await gs('getWeek', anchor || null);
  S.week = w; S.draft = {}; S.dirty = {};
  w.days.forEach(d=>{
    const rows = d.lines.map(l=>({ t:l.t, c:l.hw, s:(l.hw && l.name && l.name!==l.t) ? l.name : '' }));
    rows.push({ t:'', c:true, s:'' });
    S.draft[d.date] = rows;
  });
}
function nextSchoolLabel(date){ const n = stepSchool(date,1); return md(n)+'（'+WD[dow(n)]+'）'; }
function dayCard(d){
  const rows = S.draft[d.date] || [];
  const isToday = d.date === S.week.today;
  let h = '<section class="card'+(isToday?' today':'')+'" data-day="'+d.date+'">';
  h += '<h3>週'+WD[dow(d.date)]+' '+md(d.date)+(isToday?' <span class="chip" style="background:var(--coral)">今天</span>':'')+'</h3>';
  rows.forEach((r,i)=>{
    h += '<div class="lrow" data-i="'+i+'">'+
      '<input class="in" data-f="t" value="'+esc(r.t)+'" placeholder="第 '+(i+1)+' 項聯絡簿內容" maxlength="80" enterkeyhint="next">'+
      '<button class="chk'+(r.c?' on':'')+'" data-act="chk" aria-pressed="'+r.c+'">'+(r.c?'☑ 隔天檢查':'☐ 不檢查')+'</button>'+
      '<button class="xbtn" data-act="del" aria-label="刪除這一項">✕</button>'+
      (r.c ? '<input class="in sm" data-f="s" value="'+esc(r.s)+'" placeholder="登記表上的簡稱（選填，預設用整句）" maxlength="30">' : '')+
    '</div>';
  });
  h += '<div class="sub" style="margin:4px 0 10px">勾選的項目會在 '+nextSchoolLabel(d.date)+' 自動出現在作業登記表。</div>';
  h += '<div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">'+
       '<button class="btn sm sky" data-act="add">＋新增一項</button>'+
       '<button class="btn sm green" data-act="save">儲存這天</button>'+
       '<span class="stxt" id="st_'+d.date+'">'+(S.dirty[d.date]?'尚未儲存':'')+'</span></div>';
  return h+'</section>';
}
function viewWeek(){
  if (!S.week) return '<div class="empty-ad">載入中…</div>';
  const curNotice = (S.board && S.board.notice) ? S.board.notice : '';
  let h = '<section class="card"><h3>📢 教室黑板便條（聯絡簿置頂提醒）</h3>'+
    '<div style="display:flex;gap:8px;flex-wrap:wrap">'+
    '<input class="in grow" id="noticeIn" value="'+esc(curNotice)+'" placeholder="例如：週五校外教學記得帶水壺、穿班服" maxlength="120" style="min-width:220px">'+
    '<button class="btn sm green" data-act="saveNotice">更新便條</button>'+
    '<button class="btn sm plain" data-act="clearNotice">清除</button></div></section>';
  const m = S.week.monday, f = addDays(m,4);
  h += '<div class="weeknav"><button class="btn sm plain" data-act="wprev">◀ 上週</button>'+
    '<div class="mid">'+md(m)+'（一）～ '+md(f)+'（五）</div>'+
    '<button class="btn sm plain" data-act="wnext">下週 ▶</button></div>'+
    '<div class="weekgrid">'+S.week.days.map(dayCard).join('')+'</div>';
  return h;
}
function setStTxt(date, txt){ const el = document.getElementById('st_'+date); if (el) el.textContent = txt; }
async function saveDay(date){
  const rows = (S.draft[date]||[]).filter(r=>r.t.trim()).map(r=>({ text:r.t.trim(), check:r.c, short:(r.s||'').trim() }));
  setStTxt(date,'儲存中…');
  try {
    await gs('saveHomework', date, rows);
    S.dirty[date] = false; S.lastWrite = Date.now(); S.writeSeq++;
    setStTxt(date,'已儲存 ✓ '+nowTime());
    fetchBoard(true);
    return true;
  } catch(e) { setStTxt(date,'儲存失敗'); handleErr(e); return false; }
}
async function saveAllDirty(){
  const ds = Object.keys(S.dirty).filter(d=>S.dirty[d]);
  for (const d of ds) await saveDay(d);
}
function focusRow(day, i){
  const el = document.querySelector('.card[data-day="'+day+'"] .lrow[data-i="'+i+'"] input[data-f="t"]');
  if (el) el.focus();
}

function setLocal(it, seat, status){
  if (status) S.board.status[skey(it,seat)] = status;
  else delete S.board.status[skey(it,seat)];
}
function payload(it, seat, status){ return { due:S.board.date, source:it.source, name:it.name, seat:seat, status:status }; }
function applyStatuses(it, list){
  list.forEach(x=>setLocal(it,x[0],x[1]));
  queueStatusBatch(list.map(x=>payload(it,x[0],x[1])));
  S.lastJson = '';
  saveLocalSnap(JSON.stringify(S.board));
  renderRegTop(); renderRegSeats();
}

function viewTrack(){

          : '<button class="btn sm green" data-act="tk" data-g="'+gi+'" data-seat="'+e.seat+'" data-to="corrected">訂正完成 ✗</button>')+

function tkApply(gi, list){
  const b = S.board, g = b.carry[gi]; if (!g) return;
  const it = { source:g.source, name:g.name };
  list.forEach(x=>{
    const e = g.entries.find(y=>y.seat===x[0]); if (!e) return;
    if (x[1]==='done' || x[1]==='corrected') g.entries = g.entries.filter(y=>y!==e);
    else e.status = x[1];
  });
  if (!g.entries.length) b.carry.splice(gi,1);
  S.lastJson = '';
  queueStatusBatch(list.map(x=>({ due:g.due, source:it.source, name:it.name, seat:x[0], status:x[1] })));
  renderAdmin();
}

  if (ev.target.id === 'ptReasonIn') { S.ptReason = ev.target.value; return; }
  const row = ev.target.closest('.lrow'); if (!row) return;
  const day = row.closest('.card').dataset.day, i = +row.dataset.i, f = ev.target.dataset.f;
  if (!f) return;
  S.draft[day][i][f === 't' ? 't' : 's'] = ev.target.value;
  S.dirty[day] = true; setStTxt(day,'尚未儲存');
});
adBody.addEventListener('keydown', ev=>{
  if (ev.key !== 'Enter' || !ev.target.matches('input[data-f="t"]')) return;
  ev.preventDefault();
  const row = ev.target.closest('.lrow'), day = row.closest('.card').dataset.day, i = +row.dataset.i;
  const rows = S.draft[day];
  if (i === rows.length-1) { rows.push({t:'',c:true,s:''}); renderAdmin(); }
  focusRow(day, i+1);
});
adBody.addEventListener('change', async ev=>{
  if (ev.target.id === 'srcSel') {
    try { await gs('setSource', S.board.date, ev.target.value); S.writeSeq++; S.lastJson=''; await fetchBoard(true); renderAdmin(); toast('已更換作業來源'); }
    catch(e){ handleErr(e); }
  }
});
adBody.addEventListener('click', async ev=>{
  const btn = ev.target.closest('[data-act]'); if (!btn) return;
  const act = btn.dataset.act;
  const card = btn.closest('.card');
  const day = card && card.dataset.day;

  if (act === 'saveRoster') {
    const raw = ($('#rosterTxt').value || '').trim();
    const parsed = [];
    raw.split(/\r?\n/).forEach(line => {
      const m = line.trim().match(/^(\d+)[\s,，\t]+(.+)$/);
      if (m) parsed.push({ seat: Number(m[1]), name: m[2].trim() });
    });
    if (!parsed.length) { toast('請至少輸入一位學生（格式：1 王小明）'); return; }
    parsed.sort((a,b) => a.seat - b.seat);
    btn.disabled = true;
    try {
      await gs('saveStudents', parsed);
      S.writeSeq++; S.lastJson = '';
      await fetchBoard(true);
      renderAdmin();
      toast('✅ 已更新班級名單（共 ' + parsed.length + ' 位學生）');
    } catch(e){ handleErr(e); }
    btn.disabled = false;
    return;
  }

  if (act === 'saveNotice' || act === 'clearNotice') {
    const val = act === 'clearNotice' ? '' : ($('#noticeIn').value || '').trim();
    btn.disabled = true;
    try {
      await gs('saveNotice', val);
      S.writeSeq++; S.lastJson = '';
      await fetchBoard(true);
      renderAdmin();
      toast(val ? '已更新黑板便條' : '已清除黑板便條');
    } catch(e){ handleErr(e); }
    btn.disabled = false;
    return;
  }

  if (act === 'chk') { const i = +btn.closest('.lrow').dataset.i; const r = S.draft[day][i]; r.c = !r.c; S.dirty[day] = true; renderAdmin(); return; }
  if (act === 'del') { const i = +btn.closest('.lrow').dataset.i; S.draft[day].splice(i,1); if (!S.draft[day].length) S.draft[day].push({t:'',c:true,s:''}); S.dirty[day] = true; renderAdmin(); return; }
  if (act === 'add') { S.draft[day].push({t:'',c:true,s:''}); renderAdmin(); focusRow(day, S.draft[day].length-1); return; }
  if (act === 'save') { btn.disabled = true; const ok = await saveDay(day); btn.disabled = false; if (ok) toast('已儲存 '+md(day)); return; }
  if (act === 'wprev' || act === 'wnext') {
    await saveAllDirty();
    try { await loadWeek(addDays(S.week.monday, act==='wprev'?-7:7)); } catch(e){ handleErr(e); }
    renderAdmin(); return;
  }

  if (act === 'sel') { await flushStatusBuffer(); const it = S.board.items[+btn.dataset.i]; S.sel = it.source+'|'+it.name; S.delArm = false; renderRegTop(); renderRegSeats(); return; }
  if (act === 'mode') { S.mode = btn.dataset.m; renderRegSeats(); return; }
  if (act === 'seat') {
    const it = selectedItem(); if (!it) return;
    const seat = +btn.dataset.seat, cur = S.board.status[skey(it,seat)] || '';
    let nx;
    if (S.mode === 'cycle') nx = NEXT[cur] !== undefined ? NEXT[cur] : 'done';
    else nx = (cur === S.mode) ? '' : S.mode;
    applyStatuses(it, [[seat,nx]]);
    const nb = $('#regSeats .seatbtn[data-seat="'+seat+'"] .ic'); if (nb) nb.classList.add('pop');
    return;
  }
  if (act === 'allDone' || act === 'allReset') {
    const it = selectedItem(); if (!it) return;
    applyStatuses(it, S.board.students.map(s=>[s.seat, act==='allDone'?'done':'']));
    return;
  }
  if (act === 'tempopen') { S.tempOpen = true; renderRegTop(); return; }
  if (act === 'tempno')   { S.tempOpen = false; renderRegTop(); return; }
  if (act === 'tempgo') {
    const name = ($('#tempIn').value||'').trim(); if (!name) { toast('請輸入項目名稱'); return; }
    btn.disabled = true;
    try {
      await flushStatusBuffer();
      await gs('addTempItem', S.board.date, name);
      S.writeSeq++; S.lastJson=''; S.tempOpen = false; S.sel = S.board.date+'|'+name;
      await fetchBoard(true); renderAdmin(); toast('已新增臨時項目');
    } catch(e) { handleErr(e); btn.disabled = false; }
    return;
  }
  if (act === 'tempdel') {
    if (!S.delArm) { S.delArm = true; renderRegTop(); setTimeout(()=>{ if (S.delArm) { S.delArm=false; if (S.tab==='register') renderRegTop(); } }, 3500); return; }
    const it = selectedItem(); S.delArm = false;
    try { await flushStatusBuffer(); await gs('removeTempItem', S.board.date, it.name); S.writeSeq++; S.sel = null; S.lastJson=''; await fetchBoard(true); renderAdmin(); toast('已刪除臨時項目'); }
    catch(e){ handleErr(e); }
    return;
  }

  if (act === 'tk') { tkApply(+btn.dataset.g, [[+btn.dataset.seat, btn.dataset.to]]); return; }
  if (act === 'tkall') {
    const g = S.board.carry[+btn.dataset.g]; if (!g) return;
    tkApply(+btn.dataset.g, g.entries.map(e=>[e.seat, e.status==='unsubmitted'?'done':'corrected']));
    return;
  }

  if (act === 'grantLotto') {
    const seat = +btn.dataset.seat;
    btn.disabled = true;
    try {
      const res = await gs('grantExtraLottery', seat);
      S.writeSeq++; S.lastJson = '';
      await fetchBoard(true);
      renderAdmin();
      toast('⭐ 已發放抽獎機會給 ' + seat + ' 號 ' + (res.name || '') + '！');
    } catch(e){ handleErr(e); }
    btn.disabled = false;
    return;
  }
  if (act === 'grantLottoAll') {
    btn.disabled = true;
    try {
      const res = await gs('grantAllExtraLottery');
      S.writeSeq++; S.lastJson = '';
      await fetchBoard(true);
      renderAdmin();
      toast('🌟 已給予全班 ' + (res.count || '') + ' 位同學再抽獎一次！');
    } catch(e){ handleErr(e); }
    btn.disabled = false;
    return;
  }

  if (act === 'ptSeat') { const s = +btn.dataset.seat; S.ptSeats.has(s)?S.ptSeats.delete(s):S.ptSeats.add(s); renderAdmin(); return; }
  if (act === 'ptAll') { S.board.students.forEach(s=>S.ptSeats.add(s.seat)); renderAdmin(); return; }
  if (act === 'ptClear') { S.ptSeats.clear(); renderAdmin(); return; }
  if (act === 'ptRsn') { S.ptReason = btn.dataset.r; renderAdmin(); return; }
  if (act === 'ptGo') {
    if (!S.ptSeats.size) { toast('請先點選要加減分的學生'); return; }
    const delta = +btn.dataset.d;
    const reason = ($('#ptReasonIn').value || '').trim() || S.ptReason;
    btn.disabled = true;
    try {
      await gs('addPoints', [...S.ptSeats], delta, reason);
      S.ptSeats.clear(); S.writeSeq++; S.lastJson = '';
      await fetchBoard(true); renderAdmin();
      toast('已記錄 '+(delta>0?'+'+delta:delta)+' 分！');
    } catch(e){ handleErr(e); }
    btn.disabled = false;
    return;
  }
  if (act === 'resetScores') {
    if (!S.resetArm) {
      S.resetArm = true;
      renderAdmin();
      setTimeout(() => { if (S.resetArm) { S.resetArm = false; if (S.tab === 'points') renderAdmin(); } }, 4000);
      return;
    }
    S.resetArm = false;
    btn.disabled = true;
    try {
      await gs('resetAllScores');
      S.ptSeats.clear(); S.writeSeq++; S.lastJson = '';
      await fetchBoard(true); renderAdmin();
      toast('🔄 全班積分已全部歸零！');
    } catch(e){ handleErr(e); }
    btn.disabled = false;
    return;
  }
});

renderLegend();
bootFromLocalSnap();
fetchBoard(true);
</script>
</body>
</html>
